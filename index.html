/* ---- 画像 ---- */
function bufToB64(buf) { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }

  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const sc = Math.min(1, maxW / img.width); const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

const loadImg = (b64) => new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error("画像を読めません")); img.src = `data:image/jpeg;base64,${b64}`; });
/* 横長なら見開き（2ページ）、縦長なら片ページ */
const isSpreadShape = (w, h) => w > h * 1.15;
/* 画像の形の並びから、各画像のページ番号を割り当てる。shapes: ["spread"|"single", …] */
function assignPages(start, shapes) { let n = start; return shapes.map((sh) => (sh === "spread" ? [n++, n++] : [n++])); }
/* 見開きの綴じ目（切る位置）を推定する。px は RGBA の画素、w×h は縮小後の大きさ。
   中央付近（幅の35〜65%）で、暗い縦の帯（綴じ目の影）があればその中心。無ければ、何も書かれていない縦の帯（左右の余白が合わさった所）のうち中央に最も近いものの中心。
   どちらも無ければ真ん中。戻り値は 0〜1 の割合 */
function findGutter(px, w, h) {
  const lo = Math.floor(w * 0.35), hi = Math.ceil(w * 0.65);

  const med = [...dark].sort((a, b) => a - b)[Math.floor(w / 2)];
  let best = -1, bv = -1; for (let x = lo; x < hi; x++) if (dark[x] > bv) { bv = dark[x]; best = x; }
  // 影: 文字の列はまばらなので平均は薄い。列全体がはっきり暗い（平均の暗さ 100 超）ものだけを影とみなす
  if (best >= 0 && bv > 100 && bv > med + 40) { let a = best, b = best; while (a > lo && dark[a - 1] > Math.max(60, med + 20)) a--; while (b < hi - 1 && dark[b + 1] > Math.max(60, med + 20)) b++; return ((a + b) / 2 + 0.5) / w; }

  const minRun = Math.max(3, Math.round(w * 0.02)); const runs = []; let st = -1;

/* 画像を見て、見開きなら綴じ目で左右に切って2ページ、片ページならそのまま1ページ。rightFirst（右綴じ・縦書き）なら右ページが先。canvas が無ければそのまま1つ返す */

/* ページ画像に青い印（番号つき）を描き込む。AI に「印の位置の問題」を読ませるため。canvas が無い環境ではそのまま返す。
   色は青。赤だと答案に既にある赤ペンの ○×✓ と混同され、印の無い問題まで間違いとして拾われた（2026-09-10）。
   印は小さな点（幅の 0.7%、最小 5px）と、その右横の番号。以前の大きな丸（幅の 2.8%）と上の番号は隣の問題にかぶり、AI が別の問題を読むことがあった */

  if (!marks.length || typeof Image === "undefined") return b64;

}

/* ---- 外部ライブラリ（html2canvas / jsPDF / pdf.js） ---- */
let _libs = null;
const loadScript = (src) => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("ライブラリを読み込めません（通信を確認）")); document.head.appendChild(el); });

const loadPdfjs = () => loadScript(PDFJS + "pdf.min.js").then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; });
/* PDF を1ページずつ JPEG（base64）にして onPage に渡す。全ページを一度にメモリへ載せない */
async function pdfToJpegs(file, onPage, maxW = 1500) {
  await loadPdfjs();
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const v0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(3, maxW / v0.width) });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    await onPage(c.toDataURL("image/jpeg", 0.8).split(",")[1], n, pdf.numPages);
    c.width = c.height = 0;
  }
  return pdf.numPages;

/* ---- iOS の共有シート ---- */
/* 共有シートは iOS/iPadOS だけ。Mac/Windows の Chrome も navigator.share を持つが、OSの共有ダイアログが開いて処理が止まるので直接保存する */

async function shareFile(blob, name, type) {
  if (!isIOS()) return false;
  try { const file = new File([blob], name, { type }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; } } catch (e) { if (e && e.name === "AbortError") return true; }

}

/* ---- 空データと移行 ---- */
/* レコードを消して墓標（deleted）に残す。同期で他の端末からも消えるように */

function migrate(d) {
  if (!d) return blank();
  if (d.v === 3) return { ...blank(), ...d, items: (d.items || []).map((i) => ((i.level || 0) > INT.length - 1 ? { ...i, level: INT.length - 1 } : i)) };

    return { ...i, level, status: level >= STABLE_LEVEL ? "stable" : "active", etype: i.etype || "", updatedAt: now(),

/* ---- 同期（Supabase の1行） ---- */
async function sbFetch(path, opts = {}) {
  const base = LS(SB_URL).replace(/\/$/, "");
  const res = await fetch(`${base}/rest/v1/${path}`, { ...opts, headers: { apikey: LS(SB_KEY), Authorization: `Bearer ${LS(SB_KEY)}`, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(`同期エラー (${res.status})`);
  const text = await res.text(); // 書き込み成功時（201, return=minimal）は本文が空。空なら null
  return text ? JSON.parse(text) : null;
}
async function pullRemote() { const rows = await sbFetch(`state?id=eq.${encodeURIComponent(LS(SB_ROOM))}&select=data,updated_at`); return rows && rows[0] ? rows[0] : null; }
async function pushRemote(data) { await sbFetch("state", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ id: LS(SB_ROOM), data, updated_at: new Date().toISOString() }) }); }
function mergeData(a, b) {
  const del = new Set([...(a.deleted || []), ...(b.deleted || [])]);
  const byId = (xs, ys) => { const m = new Map(); [...(xs || []), ...(ys || [])].forEach((r) => { if (del.has(r.id)) return; const p = m.get(r.id); if (!p || (r.updatedAt || "") > (p.updatedAt || "")) m.set(r.id, r); }); return [...m.values()]; };
  return { v: 3, updatedAt: now(), units: byId(a.units, b.units), items: byId(a.items, b.items), tests: byId(a.tests, b.tests), papers: byId(a.papers, b.papers), exams: byId(a.exams, b.exams), writing: byId(a.writing, b.writing), materials: byId(a.materials, b.materials), log: { ...(a.log || {}), ...(b.log || {}) }, backupOn: [a.backupOn, b.backupOn].filter(Boolean).sort().pop() || null, genCount: Math.max(a.genCount || 0, b.genCount || 0), badCount: Math.max(a.badCount || 0, b.badCount || 0), deleted: [...del] };
}

const MBUCKET = "materials";
const matPath = (subject, kind, page, role = "") => `${LS(SB_ROOM)}/${SUBJ_CODE[subject]}/${KIND_CODE[kind]}/${kind === "テスト" && (role === "q" || role === "a") ? role : ""}${page}.jpg`;
/* テストの紙の役割。qa＝問題と答案が同じ紙、q＝問題用紙、a＝答案。同じ番号の q と a が対になる */
const TEST_ROLES = [["qa", "問題と答案が同じ紙"], ["q", "問題用紙"], ["a", "答案"]];
const roleOf = (mt) => (mt.kind === "テスト" ? mt.role || "qa" : "");
/* 取り込みの「最初の番号」の既定: その教科・種別（テストは紙の役割ごと）で取り込み済みの最後の番号＋1、無ければ 1。
   問題用紙→答案と役割を切り替えたときに番号を 1 に戻し忘れるのを防ぐ */
const nextPageNo = (d, subject, kind, role = "qa") => { const ms = matsOf(d, subject, kind).filter((m) => kind !== "テスト" || roleOf(m) === role); return ms.length ? Math.max(...ms.map((m) => m.page)) + 1 : 1; };
/* ×をタップする紙（答案。問題と答案が同じ紙も含む） */
const answerSheets = (d, subject) => matsOf(d, subject, "テスト").filter((mt) => roleOf(mt) !== "q");
/* 答案に対応する問題用紙（同じ番号の q）。無ければ null */
const pairSheet = (d, mt) => (roleOf(mt) === "a" ? matsOf(d, mt.subject, "テスト").find((x) => roleOf(x) === "q" && x.page === mt.page) || null : null);
const stBase = () => `${LS(SB_URL).replace(/\/$/, "")}/storage/v1`;
const stHeaders = () => ({ apikey: LS(SB_KEY), Authorization: `Bearer ${LS(SB_KEY)}` });
async function stUpload(path, blob) {
  const res = await fetch(`${stBase()}/object/${MBUCKET}/${path}`, { method: "POST", headers: { ...stHeaders(), "Content-Type": blob.type || "image/jpeg", "x-upsert": "true" }, body: blob });
  if (!res.ok) throw new Error(`教材の保存エラー (${res.status})`);
}
const _matCache = new Map();
 // path → base64。端末に残さない（メモリだけ）
async function stGet(path) {
  if (_matCache.has(path)) return _matCache.get(path);
  const res = await fetch(`${stBase()}/object/authenticated/${MBUCKET}/${path}`, { headers: stHeaders() });
  if (!res.ok) throw new Error(`教材の読み出しエラー (${res.status})`);
  const b64 = bufToB64(await res.arrayBuffer());
  if (_matCache.size >= 40) _matCache.delete(_matCache.keys().next().value);
  _matCache.set(path, b64);
  return b64;
}
async function stRemove(paths) {
  if (!paths.length) return;
  const res = await fetch(`${stBase()}/object/${MBUCKET}`, { method: "DELETE", headers: { ...stHeaders(), "Content-Type": "application/json" }, body: JSON.stringify({ prefixes: paths }) });
  if (!res.ok) throw new Error(`教材の削除エラー (${res.status})`);
  paths.forEach((p) => _matCache.delete(p));
}

/* ---- ページ範囲と単元 ---- */
/* [10,11,12,15] → "10–12, 15" */
function pagesToRanges(nums) {
  const xs = [...new Set(nums.filter((n) => Number.isInteger(n)))].sort((a, b) => a - b);
  const out = []; let s = null, p = null;
  xs.forEach((n) => { if (s === null) { s = p = n; } else if (n === p + 1) { p = n; } else { out.push(s === p ? `${s}` : `${s}–${p}`); s = p = n; } });
  if (s !== null) out.push(s === p ? `${s}` : `${s}–${p}`);
  return out.join(", ");
}
/* "p.12-25, 30" → [12,…,25,30]。区切りは - – — ~ 〜、p. は無視 */
function parsePages(s) {
  const out = new Set(); const t = String(s || "").replace(/[pP]\.?|ページ|頁/g, " ");
  for (const m of t.matchAll(/(\d+)\s*[-–—~〜]\s*(\d+)|(\d+)/g)) {
    if (m[3]) out.add(+m[3]); else { const a = +m[1], b = +m[2]; if (b >= a && b - a < 500) for (let n = a; n <= b; n++) out.add(n); else { out.add(a); out.add(b); } }
  }
  return [...out].sort((a, b) => a - b);
}
const unitById = (d, id) => d.units.find((u) => u.id === id);
const unitPages = (u, kind) => parsePages(kind === "ワーク" ? u.wbPages : kind === "教科書" ? u.pages : "");
const unitForPage = (units, kind, page) => units.find((u) => unitPages(u, kind).includes(page)) || null;
const unitPageLabel = (u) => [u.pages ? `教科書 ${u.pages}` : "", u.wbPages ? `ワーク ${u.wbPages}` : ""].filter(Boolean).join(" ／ ");
/* 目次から読んだ候補を単元に反映する。既存の単元名に一致すればページ範囲だけ足し、なければ新規に作る */
function applyTOC(units, subject, kind, cands) {
  const field = kind === "ワーク" ? "wbPages" : "pages";
  const out = units.slice();
  cands.forEach((c) => {
    const name = (c.name || "").trim(), match = (c.match || "").trim();
    if (!name) return;
    const idx = out.findIndex((u) => u.subject === subject && (u.name === match || u.name === name));
    if (idx >= 0) { const u = out[idx]; const cur = u[field] || ""; const nv = !cur ? c.pages || "" : c.pages && !cur.includes(c.pages) ? `${cur}, ${c.pages}` : cur; out[idx] = { ...u, [field]: nv, updatedAt: now() }; }
    else out.push({ id: uid(), subject, name, pages: field === "pages" ? c.pages || "" : "", wbPages: field === "wbPages" ? c.pages || "" : "", lastTestedOn: null, updatedAt: now() });
  });
  return out;
}
const matsOf = (d, subject, kind) => (d.materials || []).filter((m) => m.subject === subject && m.kind === kind).sort((a, b) => a.page - b.page);
/* 単元群に対応する教材ページ（索引）。多すぎるときは教材ごとに均等に間引く */
function materialsForUnits(d, subject, units, max = 16) {
  const by = MKINDS.map((kind) => { const pages = new Set(units.flatMap((u) => unitPages(u, kind))); return matsOf(d, subject, kind).filter((m) => pages.has(m.page)); }).filter((xs) => xs.length);
  const cap = Math.max(1, Math.floor(max / (by.length || 1)));
  const thin = (xs) => (xs.length <= cap ? xs : Array.from({ length: cap }, (_, k) => xs[Math.floor((k * xs.length) / cap)]));
  return by.flatMap(thin);
}
const matsLabel = (ms) => MKINDS.map((k) => { const xs = ms.filter((m) => m.kind === k); return xs.length ? `${k} p.${pagesToRanges(xs.map((m) => m.page))}` : ""; }).filter(Boolean).join("、");
const taught = (u) => !!u.learnedOn;
function pickUnits(d, subject, max = 3) {
  const us = d.units.filter((u) => u.subject === subject && taught(u));
  const withActive = new Set(d.items.filter((i) => i.subject === subject && i.status === "active").map((i) => i.unitId));
  const score = (u) => (withActive.has(u.id) ? 1000 : 0) + (u.lastTestedOn ? diffDays(u.lastTestedOn, today()) : 500);
  return us.sort((a, b) => score(b) - score(a)).slice(0, max);
}

/* ---- 間隔反復と学力の指標 ---- */
/* 類題の問題数。習得中（間隔1日・3日）は3問、保持の確認（7日以上）は1問、暗記ものは常に1問。落として1日に戻れば3問に戻る */
const problemCount = (i) => (!needsWhy(i) ? 1 : (i.level || 0) <= 1 ? 3 : 1);
/* 「説明もできた」を求めるか。用語と、説明不要（暗記もの）の印がある項目は求めない */
const needsWhy = (i) => i.fmt !== "知識・用語" && !i.noWhy;
/* 落とした項目を1件作る。今日 × で登録し、明日に出る。f で上書きできる */
const newItem = (f) => ({ id: uid(), note: "", fmt: "", createdOn: today(), history: [{ d: today(), r: "x", etype: f.etype || "" }], level: 0, failCount: 1, nextDue: addDays(today(), 1), status: "active", updatedAt: now(), ...f });
function applyJudgment(item, r) {
  const t = today();
  let level = item.level || 0, failCount = item.failCount || 0;
  if (r === "x") { level = 0; failCount += 1; }
  else if (item.printedOrig && r === "o") { /* 元の問題をもう一度解いた回: 白紙再生ではないので「解けた」では据え置き */ }
  else if (r === "oo" || !needsWhy(item)) { level = Math.min(level + 1, INT.length - 1); }
  else { level = Math.min(level + 1, 3); }
  // 30日の段階で「説明もできた」（説明不要の項目は「解けた」）なら安定。安定は落とすまで安定のまま
  const passedTop = (item.level || 0) >= INT.length - 1 && r !== "x" && (r === "oo" || !needsWhy(item)) && !(item.printedOrig && r === "o");
  return { ...item, level, failCount, nextDue: addDays(t, INT[level]), status: r === "x" ? "active" : passedTop || item.status === "stable" ? "stable" : "active", gen: r === "x" ? null : item.gen, defer: null, printedOrig: null, updatedAt: now() };
}
function retention(items) {
  let c = 0, t = 0;
  items.forEach((i) => { const h = i.history || [];
    for (let k = 1; k < h.length; k++) { const gap = diffDays(h[k - 1].d, h[k].d); if (gap >= 30) { t++; if (h[k].r !== "x") c++; } } });
  return { c, t, rate: pct(c, t) };
}
function streakDays(log) {
  let n = 0, d = today();
  if (!log[d]) d = addDays(d, -1);
  while (log[d]) { n++; d = addDays(d, -1); }
  return n;
}

/* ---- 定期テスト前の後ろ倒し ---- */
/* 直近の定期テスト（範囲あり）の14日前から、範囲外の項目の再出題日をテスト翌日に後ろ倒しする。
   level は変えないので、テスト後は元の間隔で進む。印刷済み・判定中・単元なしの項目は触らない。何度呼んでも同じ */
function deferForExam(d) {
  const t = today();
  const ex = (d.exams || []).filter((e) => e.date >= t && (e.unitIds || []).length).sort((a, b) => (a.date < b.date ? -1 : 1))[0];
  if (!ex || diffDays(t, ex.date) > 14) return d;
  const after = addDays(ex.date, 1); let changed = false;
  const items = d.items.map((i) => {
    if (!i.unitId || ex.unitIds.includes(i.unitId) || i.nextDue >= after || i.printedOn || i.pending?.d === t) return i;
    changed = true; return { ...i, nextDue: after, defer: { examId: ex.id, from: i.nextDue }, updatedAt: now() };
  });
  return changed ? { ...d, items } : d;
}
/* 後ろ倒し中の項目（そのテストで、まだ再出題日が来ていないもの） */
const deferredFor = (d, ex) => d.items.filter((i) => i.defer && i.defer.examId === ex.id && i.nextDue > today());

/* ---- 採点結果の集計 ---- */
/* 撮った答案の○×（marks: {n: "o"|"x"|"blank"|"unknown"}）から、形式別の正答数と、模試なら配点による得点（100点換算は pct(score, maxScore)） */
function gradeResult(paper, marks) {
  const rows = {}; let score = 0, maxScore = 0;
  paper.questions.forEach((qq) => { const mk = marks[qq.n]; if (mk === "unknown" || !mk) return; rows[qq.fmt] = rows[qq.fmt] || { fmt: qq.fmt, total: 0, correct: 0 }; rows[qq.fmt].total++; if (mk === "o") rows[qq.fmt].correct++; if (qq.pts) { maxScore += qq.pts; if (mk === "o") score += qq.pts; } });
  const rlist = Object.values(rows);
  return { rows: rlist, total: rlist.reduce((p, c) => p + c.total, 0), correct: rlist.reduce((p, c) => p + c.correct, 0), ...(paper.kind === "模試" ? { score, maxScore } : {}) };
}
/* 定期テストの予測。その定期テストの模試（100点換算）があれば優先、無ければ直近の累積テスト */
function predictFor(d, ex, subject) {
  const mk = d.tests.filter((t) => t.kind === "模試" && t.examId === ex.id && t.subject === subject && t.maxScore > 0).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  if (mk) return { pct: pct(mk.score, mk.maxScore), src: "模試" };
  const c = d.tests.filter((t) => t.subject === subject && t.kind === "累積" && t.date <= ex.date).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  return c ? { pct: pct(c.correct, c.total), src: "累積" } : null;
}

/* 週次テストに混ぜた繰り越しの再出題を、答案の○×で判定する（○＝解けた、×・空欄＝できなかった。? は触らない） */
function judgeCarried(d, paper, marks, etypes = {}) {
  const t = today(); const dec = {};
  paper.questions.forEach((qq) => { const mk = marks[qq.n]; if (!qq.itemId || !mk || mk === "unknown") return; dec[qq.itemId] = mk === "o" ? { r: "o", via: "週次" } : { r: "x", etype: etypes[qq.n] || (mk === "blank" ? ETYPES[3] : ETYPES[0]), via: "週次" }; });
  const items = d.items.map((i) => { const dc = dec[i.id]; if (!dc) return i; const next = applyJudgment(i, dc.r); next.history = [...(i.history || []), { d: t, r: dc.r, self: "", etype: dc.r === "x" ? dc.etype : "", etypeSelf: "", via: "週次" }]; if (dc.r === "x") next.etype = dc.etype; return next; });
  return { ...d, items };
}

/* ---- 紙で回す（印刷セット・採点セット・一括確定） ---- */
/* 明日までに期日が来る未印刷の項目（子どもが判定中のものは除く） */
/* 1日の上限（今日の分に入れる問題数。3問の項目も1問の項目も問題数で合計）。設定タブで変える。既定18問 */
const DAILY_MAX_KEY = "daily_max";
const dailyMax = () => { const v = parseInt(LS(DAILY_MAX_KEY), 10); return v >= 1 && v <= 60 ? v : 18; };
/* 直近の定期テスト（範囲あり）の範囲の単元 id */
const examRangeIds = (d) => new Set((upcomingExams(d)[0] || { unitIds: [] }).unitIds);
/* 明日までに期日が来る未印刷の項目（候補）。優先順: 定期テストの範囲内 → 落とした回数 → 期日が古い */
function printSet(d) {
  const lim = addDays(today(), 1); const range = examRangeIds(d);
  return d.items.filter((i) => i.status !== "stable" && !i.printedOn && i.nextDue <= lim && i.pending?.d !== today())
    .sort((a, b) => (range.has(b.unitId) - range.has(a.unitId)) || b.failCount - a.failCount || (a.nextDue < b.nextDue ? -1 : 1));
}
/* 一度に多数を登録したとき（今日の登録が上限の2倍以上）、初回の期日を翌日から上限ずつ後ろにずらす。全部が翌日に集中しないように */
function spreadDue(newItems, d, max = dailyMax()) {
  const perDay = Math.max(3, Math.round(max / 3)); // 新しい項目は3問なので、1日の問題数の上限を3で割った件数
  const t = today(); const already = (d.items || []).filter((i) => i.createdOn === t).length;
  if (already + newItems.length < perDay * 2) return newItems;
  return newItems.map((i, k) => ({ ...i, nextDue: addDays(t, 1 + Math.floor((already + k) / perDay)) }));
}
/* 候補のうち上限までを「今日の分」に、残りは繰り越し */
function pickDaily(d, max = dailyMax()) {
  const all = printSet(d); const chosen = []; let problems = 0;
  for (const i of all) { const c = problemCount(i); if (chosen.length && problems + c > max) break; chosen.push(i); problems += c; }
  return { chosen, rest: all.slice(chosen.length), all, problems };
}
/* 印刷済みで、まだ確定していない項目 */
function gradeSet(d) {
  return d.items.filter((i) => i.printedOn).sort((a, b) => (a.printedOn < b.printedOn ? -1 : a.printedOn > b.printedOn ? 1 : (a.printedAs || 999) - (b.printedAs || 999) || b.failCount - a.failCount));
}
/* 紙の判定欄の読み取り。AI に渡す項目の一覧（紙の順、見出しと最初の問題で位置を示す） */
const selfMarksText = (items, unitOf) => { const p = genToPaper(items, unitOf); return items.map((i, k) => { const u = unitOf(i.unitId); const qs = p.questions.filter((q) => q.itemId === i.id && q.jb); const nums = qs.filter((q) => !q.why).map((q) => q.n); const w = qs.find((q) => q.why); return `${k + 1}. 【${i.subject}${u ? "・" + u.name : ""}】 問${nums.join("・") || "—"}${w ? `（説明は問${w.n}）` : ""}`; }).join("\n"); };
/* 読み取った印（{n: "x"|"o"|"oo"|""}）を採点画面の判定に。子どもの判定＝親の判定の初期値。× なら前回の誤答の種類 */
function applySelfMarks(items, marks) {
  const out = {};
  items.forEach((i, k) => { const r = marks[k + 1]; if (r === "bad") { out[i.id] = { bad: true, self: null, r: null, skip: false }; } else if (r === "x" || r === "o" || r === "oo") { const rr = r === "oo" && !needsWhy(i) ? "o" : r; out[i.id] = { self: rr, r: rr, etype: rr === "x" ? i.etype || "" : "", skip: false }; } });
  return out;
}
/* decisions: {id: {r, self, etype, etypeSelf}} または {id: {skip:true}}。r のあるものだけ判定し、skip は印刷前に戻す */
function judgeAll(d, decisions) {
  const t = today(); let n = 0, bad = 0;
  const items = d.items.map((i) => {
    const dc = decisions[i.id]; if (!dc) return i;
    if (dc.skip) return { ...i, printedOn: null, printedOrig: null, updatedAt: now() };
    if (dc.bad) { bad++; return { ...i, printedOn: null, printedOrig: null, gen: null, genOn: null, badN: (i.badN || 0) + 1, updatedAt: now() }; } // 問題が変: 判定せず翌日に作り直す
    if (!dc.r) return i;
    n++;
    const next = applyJudgment(i, dc.r);
    next.history = [...(i.history || []), { d: t, r: dc.r, self: dc.self || "", etype: dc.r === "x" ? dc.etype || "" : "", etypeSelf: dc.etypeSelf || "", ...(i.printedOrig ? { orig: true } : {}) }];
    next.pending = null; next.printedOn = null;
    if (dc.r === "x" && dc.etype) next.etype = dc.etype;
    return next;
  });
  return { d: { ...d, items, badCount: (d.badCount || 0) + bad, log: n ? { ...d.log, [t]: true } : d.log }, n, bad };
}

/* ---- ×のタップ登録 ---- */
/* 印の当たり判定。表示上の距離（px）が近い印の添字、無ければ -1 */
function tapHit(marks, x, y, w, h, r = 22) {
  let best = -1, bd = r;
  marks.forEach((m, k) => { const dx = (m.x - x) * w, dy = (m.y - y) * h; const dd = Math.sqrt(dx * dx + dy * dy); if (dd < bd) { bd = dd; best = k; } });
  return best;
}
/* そのページに登録済みの項目（座標つき） */
const marksOn = (d, path) => (d.items || []).filter((i) => i.src && i.src.path === path && typeof i.src.x === "number");
/* タップ位置を未定着項目にする。名前は仮（AIが後で付ける）。誤答の種類は「知らなかった」 */
function tapsToItems(taps, subject, us, fallbackUnitId = "") {
  const perPage = {};
  return taps.map((t) => {
    const u = unitForPage(us, t.kind, t.page);
    const k = (perPage[t.path] = (perPage[t.path] || 0) + 1);
    return newItem({ subject, unitId: u ? u.id : fallbackUnitId || "", label: `${t.kind} p.${t.page} の×（${k}）`, named: false, etype: ETYPES.includes(t.etype) ? t.etype : ETYPES[0], src: { path: t.path, kind: t.kind, page: t.page, x: t.x, y: t.y, ...(t.qpath ? { qpath: t.qpath } : {}) } });
  });
}
const hasPos = (s) => !!(s && s.path && typeof s.x === "number" && typeof s.y === "number");
/* 類題生成の入力。元の問題（教材ページ）があれば画像を先に付ける */
const srcLabel = (s) => (s && s.path ? `${s.kind} p.${s.page}${s.q ? ` 「${s.q}」` : ""}` : "");
/* 印の位置にある問題の説明（AIへ渡す文） */
const markDesc = (s, n = null) => (hasPos(s) ? `${n ? `青い点の印（右横に番号${n}）` : "青い点の印"}の位置にある問題（${s.kind} p.${s.page}）` : srcLabel(s));
/* リスニングは紙で反復できないので、未定着には入れず形式の弱点として記録する（設計思想10）。
   patch のうち fmt が「リスニング」の項目を外し、紙ごとに「出題数（AIが数えた数、×の数より少なければ×の数）・正答数＝出題数−×」の記録を作る */
function splitListening(items, patch, listening = []) {
  const ids = items.filter((i) => patch[i.id] && patch[i.id].fmt === "リスニング").map((i) => i.id);
  const byPath = {}; items.filter((i) => ids.includes(i.id)).forEach((i) => { (byPath[i.src.path] = byPath[i.src.path] || []).push(i); });
  const tests = Object.keys(byPath).map((path) => { const g = byPath[path]; const s0 = g[0]; const lt = listening.find((x) => x.path === path); const total = Math.max(g.length, lt ? lt.total : 0);
    return { id: uid(), subject: s0.subject, date: today(), kind: "定期", source: `返却テスト（${s0.src.kind} ${s0.src.page}${s0.src.kind === "テスト" ? "枚目" : "ページ"}）リスニング`, rows: [{ fmt: "リスニング", total, correct: total - g.length }], total, correct: total - g.length, unitIds: [], updatedAt: now() }; });
  return { ids, tests };
}
/* 既存の未定着項目と同じ技能と判定された新しい項目は作らず、既存の項目の落とした回数を増やして期日を翌日にする（積み上がり防止） */
function mergeSameSkill(d, newIds, patch) {

/* ---- 索引と進度 ---- */

/* やったページから進度を自動判定。単元のワーク（または教科書）のページのどれかが「やった」なら、その単元は習った扱い。手動の「ここまで」は残る */

/* 定期テストの範囲で、ワークの手つかずのページ（取り込み済みなのに「やった」になっていないページ）。索引があれば問題数も */

/* ページの問題番号の索引を AI で作る。{ns:["1","2(1)",…], at} */

 // このセッションで索引を作りにいったページ（成功・失敗とも）

/* ---- 作問（週次・累積・模試で共通） ---- */
/* 用紙を1枚作る。units は出題範囲。opts: kind, n（問題数）, onStep（進捗表示）, images（参考画像 [{label, b64}]）, fields（用紙に足す項目） */
async function genPaper(d, subject, units, opts) {
  const { kind, onStep = () => {}, images = [], fields = {} } = opts;
  if (!units.length) throw new Error(`${subject}：出題範囲の単元がありません`);
  // 上限から溢れた再出題（繰り越し）は週次テストに1問ずつ混ぜる。問題数はそのぶん増やす（上限30）
  const carry = kind === "週次" ? pickDaily(d).rest.filter((i) => i.subject === subject) : [];
  const n = kind === "週次" ? Math.min(30, (parseInt(opts.n, 10) || 10) + carry.length) : opts.n || "10";
  const stuck = d.items.filter((i) => i.subject === subject && i.status === "active" && units.some((u) => u.id === i.unitId));
  const stable = kind === "累積" ? d.items.filter((i) => i.subject === subject && i.status === "stable").map((i) => i.label) : [];
  // 単元に結びついた教材ページを共有先から読む。読めなくても作問は続ける
  const mats = materialsForUnits(d, subject, units); const matImgs = []; let matNote = "";
  for (let k = 0; k < mats.length; k++) { onStep(`${subject}（教材ページ ${k + 1}/${mats.length}）`); try { matImgs.push({ m: mats[k], b64: await stGet(mats[k].path) }); } catch (e) { matNote = `教材ページを読めなかったので添付なし（${e.message}）`; matImgs.length = 0; break; } }
  onStep(subject);
  const matDesc = matsLabel(matImgs.map((x) => x.m));
  const mock = kind === "模試";
  const prompt = `教科: ${subject}\n種別: ${mock ? "定期テスト前の模試（本番と同じ形式）" : kind + "テスト"}\n出題範囲:\n${units.map((u) => `・${u.name}${unitPageLabel(u) ? "（" + unitPageLabel(u) + "）" : ""}${u.lastTestedOn ? " 最終出題 " + u.lastTestedOn : " 未出題"}`).join("\n")}\n\n未定着項目（必ず含める。落とした回数が多いほど手厚く）:\n${stuck.length ? stuck.map((i) => `・${i.label}（${i.failCount}回${i.note ? "／" + i.note : ""}${i.etype ? "／" + i.etype : ""}）`).join("\n") : "（なし）"}${carry.length ? `\n\n繰り越しの再出題（必ず1問ずつ。その項目そのものを白紙から解かせる問題にし、item にその id を入れる）:\n${carry.map((i) => `・${i.label}（id: ${i.id}${i.note ? "／" + i.note : ""}）`).join("\n")}` : ""}${kind === "累積" ? `\n\n安定している項目（月1の確認。必ず数問混ぜる）:\n${stable.slice(0, 15).join(" / ") || "（なし）"}` : ""}\n\n${mock ? mockPromptFor(subject, images.length) : `${n}問作ってください。`}${matImgs.length ? `\n添付の図1〜図${matImgs.length}（${matDesc}）は、出題範囲のワーク・教科書の実物。用語・記号・表現・扱われ方と難易度をこれに合わせ、ワークがあればワークの問題に近い形式で出す。本文や設問をそのまま写さない。地形図・実験装置・グラフ・英語の本文など自分で描けないものを使う問題は、「図3の地図を見て」のように図番号で参照して出題してよい（参照した図は資料として問題用紙と一緒に印刷される。参照は必要な問題だけにし、fig にその番号を入れる）。` : ""}`;
  const system = `日本の中学1年生向けの、白紙から解かせる${kind === "累積" ? "累積（過去範囲を混ぜた）" : mock ? "定期テストの模試（本番と同じ形式）" : ""}テストを作る。厳守:
- 中1範囲を超えない。指定範囲から逸脱しない

- 選択肢・穴埋めのヒントなし。数学は途中式を書かせる。英語は日本語→英文を含める
- 難易度は${mock ? "学校の定期テスト相当（基本7割、応用3割）" : "学校のワーク相当"}

- 各問に単元名・形式・ねらい・項目名をつける。形式は次から: ${FORMATS.join("／")}。項目名は「後日その一点だけを聞き直せる粒度」で書く（例:「係数が分数の一次方程式」）
${mock ? MOCK_JSON : 'JSONのみ: {"questions":[{"q":"問題文","a":"解答（途中式含む）","unit":"単元名","fmt":"形式","aim":"ねらい","label":"項目名","svg":"","fig":0' + (carry.length ? ',"item":"繰り越しの再出題なら id、それ以外は空"' : "") + '}]}'}`;
  const parts = [...images.flatMap((im) => [{ type: "text", text: `【参考】${im.label}` }, imgBlock(im.b64)]), ...matImgs.flatMap((x, k) => [{ type: "text", text: `【図${k + 1}】${x.m.kind} p.${x.m.page}` }, imgBlock(x.b64)])];
  const content = parts.length ? [...parts, { type: "text", text: prompt }] : prompt;
  const t = await callAI(content, system, mock ? 9000 : 6000, mock ? OPUS : SONNET);
  const parsed = parseJSON(t);
  const raw = mock ? flattenSections(parsed) : (parsed.questions || []).map((x) => ({ ...x, sec: "" }));
  const qs = raw.map((x, i) => {
    const u = units.find((uu) => uu.name === x.unit) || units.find((uu) => (x.unit || "").includes(uu.name) || uu.name.includes(x.unit || "")) || units[0];
    const ci = carry.find((c) => c.id === x.item);
    return { n: i + 1, q: x.q || "", a: x.a || "", unitId: ci ? ci.unitId : u.id, fmt: FORMATS.includes(x.fmt) ? x.fmt : FORMATS[0], aim: x.aim || "", label: ci ? ci.label : x.label || x.aim || "", svg: x.svg || "", fig: Number(x.fig) || 0, ...(ci ? { itemId: ci.id } : {}), ...(mock ? { sec: x.sec || "", pts: Number(x.pts) || 0 } : {}) };
  });
  if (!qs.length) throw new Error(`${subject}：問題を生成できませんでした`);

  // 問題文が参照した教材ページだけを資料として持つ（参照だけ。画像は PDF 生成時に読む）
  const used = usedFigs(qs);

  return { paper, note: `${matNote || (matDesc ? `教材 ${matDesc} を参照${refs.length ? `、資料 ${refs.length}ページ` : ""}` : "教材なし")}${carry.length ? `、繰り越し ${qs.filter((q) => q.itemId).length}/${carry.length} 件を再出題` : ""}` };
}
/* 模試の形式。本番の定期テストに寄せる: 50分・100点満点・各問に配点・大問は 知識→計算→応用→記述 の順 */
const MOCK_SECTIONS = { 数学: "【1】用語・基本事項 →【2】計算 →【3】応用（文章題・図形・関数）→【4】記述（考え方や理由を説明）", 英語: "【1】単語・文法の知識 →【2】書きかえ・並べかえ →【3】読解（本文は自作）→【4】英作文", 国語: "【1】漢字・語句・文法 →【2】読解（本文は自作の短文）→【3】応用（要旨・心情）→【4】記述（字数指定）", 社会: "【1】用語 →【2】年代・地名・数値 →【3】資料・地図の読み取り →【4】記述（理由や影響を説明）", 理科: "【1】用語 →【2】計算 →【3】実験・観察・グラフの読み取り →【4】記述（理由を説明）" };
const mockPromptFor = (subject, nRef) => `本番の定期テストと同じ形式で作ってください。50分・100点満点。大問は ${MOCK_SECTIONS[subject] || "【1】知識 →【2】計算・基本 →【3】応用 →【4】記述"} の順で4つ。問題数は25〜35問。各問に配点 pts（整数）を付け、合計をちょうど100点にする。配分の目安は知識3割・計算/基本3割・応用3割・記述1割。記述は解答が2〜4行になる問いを2〜3問。${nRef ? "添付の【参考】は実際に返却された定期テストの答案。大問の数、配点の配分、記述の量、設問の言い回しをこれに寄せる。問題文をそのまま写さない。" : ""}`;
const MOCK_JSON = 'JSONのみ: {"sections":[{"title":"【1】用語・基本事項","questions":[{"q":"問題文","a":"解答（途中式含む）","pts":4,"unit":"単元名","fmt":"形式","aim":"ねらい","label":"項目名","svg":"","fig":0}]}]}';
/* 大問ごとの問題を1列にする。sec に大問名 */
const flattenSections = (parsed) => (parsed.sections || []).flatMap((sc) => (sc.questions || []).map((x) => ({ ...x, sec: sc.title || "" }))).concat((parsed.questions || []).map((x) => ({ ...x, sec: x.sec || "" })));
/* 配点の合計をちょうど total に。0 や欠けは1点扱いで比例配分し、端数は最後の問題で調整 */
function normalizePts(qs, total = 100) {
  if (!qs.length) return qs;
  const raw = qs.map((q) => (Number(q.pts) > 0 ? Number(q.pts) : 1)); const sum = raw.reduce((a, b) => a + b, 0);
  let acc = 0; qs.forEach((q, k) => { q.pts = Math.max(1, Math.round((raw[k] * total) / sum)); acc += q.pts; });
  qs[qs.length - 1].pts = Math.max(1, qs[qs.length - 1].pts + (total - acc));
  return qs;
}

/* 検算の対象: 数学・理科の計算、英語の文法・英作文（用語・国語・社会は検算しない） */
const needsCheck = (i) => ((i.subject === "数学" || i.subject === "理科") && i.fmt === "計算") || (i.subject === "英語" && (i.fmt === "英作文" || i.fmt === "知識・用語" || i.fmt === "計算"));
/* 生成した類題を別の呼び出しで解かせ、解答と一致するか確かめる。戻り値 {ok, bad:[問番号]} */
async function verifyGen(i, g, model = null) {
  const probs = (g.problems || []); if (!probs.length) return { ok: false, bad: [] };
  const t = await callAI(`中学1年${i.subject}の問題です。各問を自分で解いてから、示された「解答」と一致するか判定してください。\n${probs.map((p, k) => `問${k + 1}: ${p.q}\n解答: ${p.a}`).join("\n\n")}`,
    `まず自力で解き、そのあと「解答」と比べる。表記の違い（分数と小数、順序、冠詞の有無など）は同じ答えなら一致とする。解答が誤り・問題が成立しない・答えが一つに決まらない場合は不一致。JSONのみ: {"results":[{"n":1,"ok":true,"answer":"自分の答え"}]}`, 1200, model);
  const rs = parseJSON(t).results || [];
  const bad = probs.map((_, k) => k + 1).filter((n) => { const r = rs.find((x) => Number(x.n) === n); return !r || r.ok !== true; });
  return { ok: bad.length === 0, bad };
}
/* 「考え方の説明」を載せる項目: 誤答の種類が「知らなかった」なら初回から、それ以外は2回以上落ちてから。子どもが読む前提で3〜5行、例題1つ。前提になる安定した項目があれば踏まえる。Opus 5 */
const needsGuide = (i) => (i.failCount || 0) >= 2 || i.etype === ETYPES[0];
async function guideFor(i, u, ctx, model = OPUS) {
  const t = await callAI(`${itemContext(i, u, ctx)}\n\nこの項目を${i.failCount}回落としています。明日この項目の類題を解く前に読む「考え方の説明」を書いてください。`,
    `中学1年生が一人で読む文章。${i.etype === ETYPES[0] ? "この項目は「知らなかった」ので、初めて習うつもりで、用語の意味から入る。" : ""}explain は3〜5行、1行30字程度、平易な言葉で「何をどう考えるか」を手順で。安定している項目は身についているものとして、それを足がかりにしてよい。専門用語は必要最小限で、出すなら一言で意味を添える。example は説明と同じ考え方で解ける例題1つと、途中の考え方を含む解答。JSONのみ: {"explain":"","example":{"q":"","a":""}}`, 1500, model);
  const r = parseJSON(t); if (!r.explain) throw new Error("説明を作れませんでした");

}
/* 3回以上落ちた項目の診断。抜けている前提と、戻って積み上げ直す手順 */
async function diagnose(i, u, ctx, model = OPUS) {
  const t = await callAI(`${itemContext(i, u, ctx)}\n\n同じ項目を${i.failCount}回落としています。反復では解決しないと判断しました。抜けている前提を特定し、そこまで戻って積み上げ直す手順を。`,
    `日本の中学1年生を教える講師。causeは最も可能性が高い原因1つ。prereqは戻るべき前提の単元（小学校範囲でも可）。stepsは3〜4段階、各段階は「何をやらせるか」だけ短く。checkは通過の判定方法。\nJSONのみ: {"cause":"","prereq":"","steps":[{"do":"","check":""}]}`, 2000, model);
  return parseJSON(t);
}
/* 「今日の分」の紙を撮って、各項目の「自分の判定」の印（□ できなかった／□ 解けた／□ 説明もできた）を読む。戻り値は {n: "x"|"o"|"oo"|""} */
async function readSelfMarks(files, items, unitOf, model = null) {
  const imgs = []; for (const f of files) imgs.push(imgBlock(await compressImage(f, 1600, 0.8)));
  const t = await callAI([...imgs, { type: "text", text: `添付は子どもが解いた類題の紙（${files.length}枚）。各問題の右端に四角い欄があり、子どもが解答を見て自分で印を書いています。○（◎や少し崩れた丸も含む）は正解、× のほか ✓・／・△・塗りつぶしなど「○ でない印」はすべて不正解として読んでください。次の項目ごとに、その項目の問題の欄を読んでください。\n${selfMarksText(items, unitOf)}` }],
    `項目ごとの判定: 説明の問いを除く問題の欄がすべて ○ なら "o"、1つでも ○ でない印（×・✓・／・△など）があれば "x"、さらに説明の問いの欄も ○ なら "oo"。欄が空の項目は ""。印があるのに ○ か判断できないときは "x"。解答の正誤は判断しない（欄の印だけを読む）。JSONのみ: {"marks":[{"n":1,"self":"x"|"o"|"oo"|""}]}`, 800, model);
  const out = {}; (parseJSON(t).marks || []).forEach((mk) => { out[Number(mk.n)] = ["x", "o", "oo"].includes(mk.self) ? mk.self : ""; });
  return out;
}

/* ---- 模試（定期テストの範囲で、1教科ずつ） ---- */
const upcomingExams = (d) => (d.exams || []).filter((e) => e.date >= today() && (e.unitIds || []).length).sort((a, b) => (a.date < b.date ? -1 : 1));
const examSubjects = (d, ex) => SUBJECTS.filter((s) => d.units.some((u) => u.subject === s && ex.unitIds.includes(u.id)));
const mocksFor = (d, ex) => (d.papers || []).filter((p) => p.kind === "模試" && p.examId === ex.id).sort((a, b) => (a.date < b.date ? 1 : -1));

/* 模試の回。定期テストの 14・7・3 日前の3回。残り日数から「いまの回」を決める（14日以内で、残り日数以上の最も近い回） */
const mockRound = (left) => (left === null || left < 0 || left > 14 ? null : [3, 7, 14].find((r) => r >= left));
/* 今日作る模試。いまの回でまだ作っていない教科を、1日1〜2教科ずつ（今日すでに作った分を差し引く） */
function mockDue(d, ex, t = today()) {
  const left = diffDays(t, ex.date); const round = mockRound(left);

function genToPaper(items, unitOf) {

  // 項目の区切りの小見出し。教科が複数あれば「教科・単元」、1教科だけなら単元だけ。単元が無く1教科なら見出しなし

  const secOf = (i, u) => (multi ? `${i.subject}${u ? "・" + u.name : ""}` : u ? u.name : "");
  items.forEach((i) => { const g = i.gen; const u = unitOf(i.unitId);
    if ((!g || !g.problems || !g.problems.length) && i.printedOrig && hasPos(i.src)) { // 類題が作れなかった項目: 元の問題を資料に載せてもう一度解かせる
      const fig = refs.length + 1; refs.push(i.src.qpath ? { n: fig, kind: i.src.kind, page: i.src.page, path: i.src.qpath } : { n: fig, kind: i.src.kind, page: i.src.page, path: i.src.path, crop: { x: i.src.x, y: i.src.y } });
      qs.push(...guideOf(i, secOf(i, u)));

      return; }
    if (!g || !g.problems || !g.problems.length) return; const isTerm = !needsWhy(i);

/* ---- PDF ---- */
/* 用紙（1枚または複数）を1つのPDFに。各用紙の「資料＋問題」を先に並べ、用紙ごとにページ数が奇数なら白紙を足して偶数にする。
   解答は全用紙ぶんを最後に、教科で改ページせず1つの流れで詰める。両面印刷1回で、解答が必ず別の紙になる */
async function buildPDF(papers, onStep) {
  const list = Array.isArray(papers) ? papers : [papers];
  const res = {}; for (const p of list) Object.assign(res, await resolveRefs(p, onStep)); // 教材ページは用紙に持たず、ここで読む
  await loadLibs();

  const W = 794, H = 1123, PX = 60, PT = 64, PB = 60;
  const fr = document.createElement("iframe");
  fr.setAttribute("aria-hidden", "true");
  fr.style.cssText = `position:fixed;left:-10000px;top:0;width:${W}px;height:1200px;border:0;opacity:0;pointer-events:none`;
  document.body.appendChild(fr);
  const doc = fr.contentDocument;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=${W},initial-scale=1"><style>html,body{margin:0;padding:0;background:#fff;color:#111;-webkit-text-size-adjust:none;text-size-adjust:none}.sw,.sw *{-webkit-text-size-adjust:none;text-size-adjust:none}.sw,.sw *{color:#111;border-color:#111}${SHEET_CSS}.sw,.sw *{font-feature-settings:normal !important;font-kerning:none !important;font-variant-ligatures:none;letter-spacing:0 !important;text-rendering:optimizeSpeed}.sw{width:${W}px;background:#fff;font-size:12.5px}.sw .sheet{padding:0 ${PX}px;background:#fff}.sw .cols{column-count:1}.sw .ttl{font-size:16px;margin-bottom:6px}.sw .hdr{font-size:10.5px;margin-bottom:14px}.sw .hdr span{padding:6px 8px}.sw .p{margin-bottom:12px;gap:10px}.sw .pn{flex:0 0 24px}.sw .pq{font-size:12.5px;line-height:1.7;margin-bottom:5px}.sw .arow,.sw .at{font-size:12px}.sw .an{flex:0 0 22px}.sw .aim{font-size:11px}.sw .psg{font-size:12.5px;line-height:1.8}.sw .sech{font-size:14px;margin:12px 0 6px}.sw .pts{font-size:10.5px}.sw .jb{flex:0 0 46px;height:46px}.sw .rule{border-bottom-color:#B0B0B0;height:21px}.sw .note,.sw .aim{color:#444}.sw .ref .cap{font-size:10.5px}.sw .guide{font-size:12px;background:#F4F4F4}.sw .g-p{font-size:11px}</style></head><body><div class="sw">${list.map((p) => `<div class="pp">${paperHTML(p, res)}</div>`).join("")}</div></body></html>`);
  doc.close();
  await new Promise((r) => setTimeout(r, 150));
  const host = doc.body;
  try {
    const pdf = new jsPDF({ unit: "px", format: [W, H], hotfixes: ["px_scaling"] });
    let firstPage = true, n = 0;
    const pages = () => (firstPage ? 0 : pdf.internal.getNumberOfPages());
    const blocksOf = (sh) => [...sh.children].flatMap((el) => (el.classList.contains("cols") || el.classList.contains("aim") ? [...el.children] : [el]));
    const draw = async (blocks) => {
      if (!firstPage) pdf.addPage(); firstPage = false;
      let y = PT;
      for (const el of blocks) {
        n++; onStep && onStep(n);
        const mb = parseFloat(getComputedStyle(el).marginBottom) || 0;
        const cv = await window.html2canvas(el, { scale: 2, backgroundColor: "#fff", logging: false, windowWidth: W });
        const w = W - PX * 2, h = (cv.height / cv.width) * w;
        const usable = H - PT - PB;

          let off = 0; const pageCanvasH = Math.floor(usable * (cv.width / w));

            if (y + Math.min(usable, ((cv.height - off) / cv.width) * w) > H - PB && y > PT) { pdf.addPage(); y = PT; }

            const dh = (ph / cv.width) * w; pdf.addImage(part.toDataURL("image/jpeg", 0.9), "JPEG", PX, y, w, dh); y += dh; off += ph;
            if (off < cv.height) { pdf.addPage(); y = PT; }

          y += mb; continue;
        }

        pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", PX, y, w, h);

    for (const pp of host.querySelectorAll(".pp")) {
      const before = pages();
      for (const sh of pp.querySelectorAll('.sheet[data-part="q"]')) await draw(blocksOf(sh));
      if (needBlank(pages() - before)) pdf.addPage();
    }
    // 解答は最後に。教科ごとに改ページせず、1つの流れで詰める
    const ans = [...host.querySelectorAll('.sheet[data-part="a"]')].flatMap(blocksOf);
    if (ans.length) await draw(ans);

  } finally { fr.remove(); }
}
/* 問題のページ数が奇数なら白紙を1枚足す（両面印刷で解答を別の紙にするため） */
const needBlank = (pages) => pages % 2 === 1;
const pdfName = (list) => (list.length === 1 ? `${list[0].subject}_${list[0].code}.pdf` : `確認テスト_${today()}_${list.length}教科.pdf`);
async function exportPDF(papers, onStep) {
  const list = Array.isArray(papers) ? papers : [papers];
  const pdf = await buildPDF(list, onStep); const name = pdfName(list);

      for (const sub of SUBJECTS) { const add = tent.filter((i) => i.subject === sub); if (!add.length) continue;
        try { const msg = await nameAndApply(dRef.current, add, sub, (id) => unitById(dRef.current, id), save); const mm = msg.match(/^(\d+)件に項目名/); if (mm) named += Number(mm[1]); } catch {} }

}

      {cands.length === 0 ? <p className="empty">{printed.length ? `印刷待ちはありません。${printed.length}件が採点待ちです。` : "明日の分はありません。"}</p>
        : (<>{[...SUBJECTS, ...cands.map((i) => i.subject)].filter((sb, k, arr) => arr.indexOf(sb) === k && cands.some((i) => i.subject === sb)).map((sb) => (<div key={sb}><h4 className="sub-h"><Dot s={sb} />{sb}<em className="pg"> {cands.filter((i) => i.subject === sb).length}件</em></h4>
          {cands.filter((i) => i.subject === sb).map((i) => { const u = unitOf(i.unitId); const on = sel.has(i.id); return (<label className={"irow pick" + (on ? " on" : "")} key={i.id}><input type="checkbox" checked={on} onChange={() => toggleSel(i.id)} disabled={!!busy} /><div className="ir-main"><div className="ir-label">{i.label}<em className="pg"> {problemCount(i)}問</em>{!auto.has(i.id) && !on && <em className="pg"> 繰り越し</em>}</div><div className="ir-meta">{u ? u.name : "—"}{i.fmt ? ` · ${i.fmt}` : ""} · {i.failCount}回{examRangeIds(d).has(i.unitId) ? " · 定期の範囲" : ""}{fresh(i) ? <> · 類題あり <button className="lnk" onClick={(e) => { e.preventDefault(); setRedo((r) => new Set([...r, i.id])); }}>作り直す</button></> : redo.has(i.id) ? " · 作り直す" : ""}{i.nextDue > today() ? ` · 期日 ${i.nextDue.slice(5)}` : i.nextDue < today() ? ` · ${diffDays(i.nextDue, today())}日繰り越し中` : ""}</div></div></label>); })}</div>))}
          <p className="ph-note">チェック {set.length} 件（{set.reduce((a, i) => a + problemCount(i), 0)} 問）、繰り越し {cands.length - set.length} 件。</p>

  </>);
}

/* ---- 夜の作業（採点 → ×登録 → 最後のページ → 明日の分。1画面ずつ「次へ」。途中で閉じても今日の分は続きから） ---- */
const NIGHT_KEY = "night_step";
const NIGHT_STEPS = [["grade", "採点", "昨日の紙を撮るか、行ごとに押して「まとめて確定」"], ["items", "×の登録", "今日のワークの×をページでタップして「まとめて登録」"], ["last", "最後のページ", "今日やった最後のページまでを「やった」に"], ["print", "明日の分", "類題を作って1つのPDFに。印刷して机へ"]];
const nightLoad = (dflt = 0) => { try { const v = JSON.parse(localStorage.getItem(NIGHT_KEY) || "null"); return v && v.d === today() && v.step >= 0 && v.step < NIGHT_STEPS.length ? v.step : dflt; } catch { return dflt; } };
const nightSave = (step) => { try { if (step === null) localStorage.removeItem(NIGHT_KEY); else localStorage.setItem(NIGHT_KEY, JSON.stringify({ d: today(), step })); } catch {} };
/* その段階にやることがあるか。無い段階は「次へ」で飛ばす（教材が無い家庭や、まだ紙が無い初日でも明日の分に着く） */
const nightHas = (d, k) => (k === "grade" ? gradeSet(d).length > 0 : k === "items" ? SUBJECTS.some((sub) => MKINDS.some((mk) => matsOf(d, sub, mk).length)) : k === "last" ? SUBJECTS.some((sub) => BOOK_KINDS.some((mk) => matsOf(d, sub, mk).length)) : true);
const nightNext = (d, from) => { for (let i = from + 1; i < NIGHT_STEPS.length; i++) if (nightHas(d, NIGHT_STEPS[i][0])) return i; return NIGHT_STEPS.length - 1; };
const nightPrev = (d, from) => { for (let i = from - 1; i >= 0; i--) if (nightHas(d, NIGHT_STEPS[i][0])) return i; return -1; };
function NightFlow({ d, save, go }) {
  const [step, setStep] = useState(() => { const v = nightLoad(null); return v === null ? nightNext(d, -1) : v; }); // 途中なら続きから、初回はやることがある最初の段階から
  const move = (n) => { setStep(n); nightSave(n); try { window.scrollTo(0, 0); } catch {} };
  const finish = () => { nightSave(null); go("home"); };
  const [k, title, hint] = NIGHT_STEPS[step];
  const next = step < NIGHT_STEPS.length - 1 ? nightNext(d, step) : -1, prev = nightPrev(d, step);
  return (<div className="pane">
    <div className="night-h"><strong>{title}</strong><em>{hint}</em></div>
    <ol className="steps" aria-label="進み具合">{NIGHT_STEPS.map(([kk, t], i) => (<li key={kk} className={i === step ? "on" : !nightHas(d, kk) ? (i < step ? "skip past" : "skip") : i < step ? "done" : ""}><span className="st-n">{i === step ? i + 1 : !nightHas(d, kk) ? "–" : i < step ? "✓" : i + 1}</span><span className="st-l">{t}</span></li>))}</ol>
    {k === "grade" && <TodayGrade d={d} save={save} />}
    {k === "items" && <ItemReg d={d} save={save} />}
    {k === "last" && <LastPageStep d={d} save={save} />}
    {k === "print" && <TodayMake d={d} save={save} />}
    <div className="night-nav">{next >= 0 ? <button className="btn-main" onClick={() => move(next)}>次へ：{NIGHT_STEPS[next][1]} →</button> : <button className="btn-main" onClick={finish}>終わる</button>}
      {prev >= 0 && <button className="lnk back" onClick={() => move(prev)}>← {NIGHT_STEPS[prev][1]}に戻る</button>}</div>
  </div>);
}

/* 印のそばに出すポップオーバー。描いてから実際の大きさを測り、見える範囲（拡大中は枠、そうでなければ画面。下のバーぶんは除く）に収まる位置へ動かす。

function MarkPop({ x, y, children }) {

  useEffect(() => {
    const el = ref.current, wrap = el && el.parentElement; if (!el || !wrap) return;
    try {
      const W = wrap.clientWidth, H = wrap.clientHeight, w = el.offsetWidth, h = el.offsetHeight, g = 10;
      const wr = wrap.getBoundingClientRect(), sr = (wrap.parentElement || wrap).getBoundingClientRect();

      const vr = Math.min(sr.right, window.innerWidth) - wr.left, vb = Math.min(sr.bottom, window.innerHeight - 70) - wr.top;

  }, [x, y]);
  return (<div ref={ref} className="mpop pop" style={pos ? { left: pos.left, top: pos.top } : { left: `${x * 100}%`, top: `${y * 100}%`, visibility: "hidden" }} onClick={(e) => e.stopPropagation()}>{children}</div>);

function FormatBlock({ d }) {

    d.tests.filter(inS).forEach((t) => rowsOf(t).forEach((r) => { const k = r.fmt; m[k] = m[k] || { fmt: k, total: 0, correct: 0, early: [0, 0], late: [0, 0] }; m[k].total += r.total; m[k].correct += r.correct; const h = t.date < mid ? "early" : "late"; m[k][h][0] += r.correct; m[k][h][1] += r.total; }));
    return Object.values(m).filter((x) => x.total > 0).sort((a, b) => a.correct / a.total - b.correct / b.total); }, [d.tests, scope]);
  const miss = useMemo(() => { const m = {}; d.items.filter((i) => i.status === "active" && (scope === "全教科" || i.subject === scope)).forEach((i) => { const k = i.fmt || "（形式未記録）"; m[k] = (m[k] || 0) + 1; }); return m; }, [d.items, scope]);

    <p className="blk-s">図・資料・長文・記述など、アプリが作れない形式も、学校のワークの結果を入れれば見えます。</p>
    <div className="seg sm">{["全教科", ...SUBJECTS].map((k) => (<button key={k} className={scope === k ? "on" : ""} onClick={() => setScope(k)}>{k}</button>))}</div>
    {stats.length === 0 && <p className="empty">記録なし。</p>}
    {stats.map((x) => { const r = pct(x.correct, x.total); const e = x.early[1] ? pct(x.early[0], x.early[1]) : null; const l = x.late[1] ? pct(x.late[0], x.late[1]) : null; return (
      <div className="mrow" key={x.fmt}><div className="mr-name">{x.fmt}{miss[x.fmt] ? <em className="fmn">未定着{miss[x.fmt]}</em> : null}</div><div className="mr-bar"><span style={{ width: `${Math.max(r, 3)}%`, background: r >= 85 ? "#2F6F5E" : r >= 70 ? "#C08A3E" : "#A8443B" }} /></div>

}
function Spark({ rows, color }) {

}

function ExportTab({ d }) {
  const [ask, setAsk] = useState("上記をふまえて、次にやるべきことを提案してください。");
  const unitOf = (id) => unitById(d, id);
  const text = useMemo(() => {
    const L = [`【学習状況 ${today()}】`];
    const nx = d.exams.filter((e) => e.date >= today()).sort((a, b) => (a.date < b.date ? -1 : 1))[0];
    if (nx) L.push(`次のテスト: ${nx.name} ${nx.date}（あと${diffDays(today(), nx.date)}日）`);
    const r = retention(d.items); if (r.t) L.push(`保持率（30日以上）: ${r.rate}% (${r.c}/${r.t})`);
    L.push(`連続実施: ${streakDays(d.log)}日`);
    SUBJECTS.forEach((s) => { const act = d.items.filter((i) => i.subject === s && i.status === "active"); const st = d.items.filter((i) => i.subject === s && i.status === "stable"); const us = d.units.filter((u) => u.subject === s); const ts = d.tests.filter((t) => t.subject === s).sort((a, b) => (a.date < b.date ? -1 : 1));
      if (!us.length && !act.length && !ts.length) return; L.push("", `■ ${s}`);
      if (ts.length) L.push("  正答率: " + ts.slice(-6).map((t) => `${t.date.slice(5)}(${t.kind}) ${pct(t.correct, t.total)}%`).join(" → "));
      const fm = {}; ts.forEach((t) => (t.rows || []).forEach((x) => { fm[x.fmt] = fm[x.fmt] || [0, 0]; fm[x.fmt][0] += x.correct; fm[x.fmt][1] += x.total; }));
      const fk = Object.entries(fm).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]); if (fk.length) L.push("  形式別: " + fk.map(([f, v]) => `${f} ${pct(v[0], v[1])}%`).join("、"));
      const never = us.filter((u) => !u.lastTestedOn); if (never.length) L.push("  未出題: " + never.map((u) => u.name).join("、"));
      if (act.length) { L.push("  未定着:"); act.sort((a, b) => b.failCount - a.failCount).forEach((i) => { const u = unitOf(i.unitId); L.push(`    ・${i.label}（${u ? u.name : "—"} / ${i.fmt || ""} / ${i.etype || ""} / ${i.failCount}回${i.note ? " / " + i.note : ""}）`); }); }
      if (st.length) L.push(`  安定: ${st.length}件`);
      const stuck = act.filter((i) => i.failCount >= 3); if (stuck.length) L.push("  ※理解の欠落が疑われる: " + stuck.map((i) => i.label).join("、")); });
    const rd = d.items.filter((i) => i.fmt === "長文読解" && i.status === "active"); if (rd.length) L.push("", "■ 読解で落としている技能: " + rd.map((i) => i.label).join("、"));
    if (d.writing.length) { const w = d.writing.slice(-5); L.push("", "■ 記述の基準点（字数/構成/表面）: " + w.map((x) => `${x.date.slice(5)} ${x.len}/${x.structure}/${x.surface}`).join("、")); }
    L.push("", "■ 依頼", ask); return L.join("\n"); }, [d, ask]);
  const copy = () => { document.getElementById("expta").select(); copyToClipboard(text); };
  return (<div className="pane"><p className="lead">週1回程度、これを貼って相談してください。読解教材の作成、記述の添削、3回以上落ちた項目の対応は、こちらで扱います。</p>
    <Fld label="依頼内容"><textarea rows={2} value={ask} onChange={(e) => setAsk(e.target.value)} /></Fld><textarea id="expta" className="exp" readOnly rows={18} value={text} /><button className="btn-main" onClick={copy}>コピーする</button></div>);
}
function Settings({ d, save, setSync }) {
