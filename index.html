/* ---- 画像 ---- */
function bufToB64(buf) { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }

function compressImage(file, maxW = 1400, quality = 0.72) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const sc = Math.min(1, maxW / img.width); const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", quality).split(",")[1]); };
      img.onerror = () => rej(new Error("画像を読めません")); img.src = r.result; };
    r.onerror = () => rej(new Error("読み込み失敗")); r.readAsDataURL(file);
  });
}
const loadImg = (b64) => new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error("画像を読めません")); img.src = `data:image/jpeg;base64,${b64}`; });
/* 横長なら見開き（2ページ）、縦長なら片ページ */
const isSpreadShape = (w, h) => w > h * 1.15;
/* 画像の形の並びから、各画像のページ番号を割り当てる。shapes: ["spread"|"single", …] */
function assignPages(start, shapes) { let n = start; return shapes.map((sh) => (sh === "spread" ? [n++, n++] : [n++])); }
/* 見開きの綴じ目（切る位置）を推定する。px は RGBA の画素、w×h は縮小後の大きさ。
   中央付近（幅の35〜65%）で、暗い縦の帯（綴じ目の影）があればその中心。無ければ、何も書かれていない縦の帯（左右の余白が合わさった所）のうち中央に最も近いものの中心。
   どちらも無ければ真ん中。戻り値は 0〜1 の割合 */
function findGutter(px, w, h) {
  const lo = Math.floor(w * 0.35), hi = Math.ceil(w * 0.65);
  const dark = new Float32Array(w), ink = new Float32Array(w);
  for (let x = 0; x < w; x++) { let sd = 0, si = 0; for (let y = 0; y < h; y++) { const i = (y * w + x) * 4; const l = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114; sd += 255 - l; if (l < 128) si++; } dark[x] = sd / h; ink[x] = si / h; }
  const med = [...dark].sort((a, b) => a - b)[Math.floor(w / 2)];
  let best = -1, bv = -1; for (let x = lo; x < hi; x++) if (dark[x] > bv) { bv = dark[x]; best = x; }
  // 影: 文字の列はまばらなので平均は薄い。列全体がはっきり暗い（平均の暗さ 100 超）ものだけを影とみなす
  if (best >= 0 && bv > 100 && bv > med + 40) { let a = best, b = best; while (a > lo && dark[a - 1] > Math.max(60, med + 20)) a--; while (b < hi - 1 && dark[b + 1] > Math.max(60, med + 20)) b++; return ((a + b) / 2 + 0.5) / w; }
  // 空白の帯: 幅が全体の 2% 以上あるものだけ（文字の間の細い隙間は除く）
  const minRun = Math.max(3, Math.round(w * 0.02)); const runs = []; let st = -1;
  for (let x = lo; x <= hi; x++) { const blank = x < hi && ink[x] < 0.01; if (blank && st < 0) st = x; if (!blank && st >= 0) { if (x - st >= minRun) runs.push([st, x - 1]); st = -1; } }
  if (runs.length) { const c = w / 2; runs.sort((p, q) => Math.abs((p[0] + p[1]) / 2 - c) - Math.abs((q[0] + q[1]) / 2 - c)); const [a, b] = runs[0]; return ((a + b) / 2 + 0.5) / w; }
  return 0.5;
}
/* 画像を見て、見開きなら綴じ目で左右に切って2ページ、片ページならそのまま1ページ。rightFirst（右綴じ・縦書き）なら右ページが先。canvas が無ければそのまま1つ返す */
async function splitSpread(b64, rightFirst) {
  if (typeof Image === "undefined") return [b64];
  const img = await loadImg(b64);
  if (!isSpreadShape(img.width, img.height)) return [b64];
  // 縮小して綴じ目を探す
  const sw = 400, sh = Math.max(1, Math.round((img.height * sw) / img.width));
  const sc = document.createElement("canvas"); sc.width = sw; sc.height = sh; const sg = sc.getContext("2d"); sg.drawImage(img, 0, 0, sw, sh);
  let g = 0.5; try { g = findGutter(sg.getImageData(0, 0, sw, sh).data, sw, sh); } catch { g = 0.5; }
  sc.width = sc.height = 0;
  const cutX = Math.round(img.width * g);
  const cut = (x0, cw) => { const c = document.createElement("canvas"); c.width = cw; c.height = img.height; c.getContext("2d").drawImage(img, x0, 0, cw, img.height, 0, 0, cw, img.height); const out = c.toDataURL("image/jpeg", 0.85).split(",")[1]; c.width = c.height = 0; return out; };
  const left = cut(0, cutX), right = cut(cutX, img.width - cutX);
  return rightFirst ? [right, left] : [left, right];
}
/* ページ画像に赤い印（番号つき）を描き込む。AI に「印の位置の問題」を読ませるため。canvas が無い環境ではそのまま返す */
async function annotateB64(b64, marks) {
  if (!marks.length || typeof Image === "undefined") return b64;
  const img = new Image(); img.src = `data:image/jpeg;base64,${b64}`;
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("画像を読めません")); });
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const g = c.getContext("2d"); g.drawImage(img, 0, 0);
  const r = Math.max(14, Math.round(img.width * 0.028));
  marks.forEach((mk, k) => {
    const x = mk.x * img.width, y = mk.y * img.height;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.lineWidth = Math.max(3, r / 4); g.strokeStyle = "#E0201A"; g.stroke();

  });

/* ---- 外部ライブラリ（html2canvas / jsPDF / pdf.js） ---- */
let _libs = null;
const loadScript = (src) => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("ライブラリを読み込めません（通信を確認）")); document.head.appendChild(el); });

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const loadPdfjs = () => loadScript(PDFJS + "pdf.min.js").then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; });
/* PDF を1ページずつ JPEG（base64）にして onPage に渡す。全ページを一度にメモリへ載せない */
async function pdfToJpegs(file, onPage, maxW = 1500) {
  await loadPdfjs();
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const v0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(3, maxW / v0.width) });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    await onPage(c.toDataURL("image/jpeg", 0.8).split(",")[1], n, pdf.numPages);
    c.width = c.height = 0;
  }
  return pdf.numPages;
}

/* ---- iOS の共有シート ---- */
/* 共有シートは iOS/iPadOS だけ。Mac/Windows の Chrome も navigator.share を持つが、OSの共有ダイアログが開いて処理が止まるので直接保存する */
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
async function shareFile(blob, name, type) {
  if (!isIOS()) return false;
  try { const file = new File([blob], name, { type }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; } } catch (e) { if (e && e.name === "AbortError") return true; }
  return false;
}

/* ---- 空データと移行 ---- */
/* レコードを消して墓標（deleted）に残す。同期で他の端末からも消えるように */
const removeRec = (d, key, ids) => { const set = new Set([].concat(ids)); return { ...d, [key]: d[key].filter((x) => !set.has(x.id)), deleted: [...d.deleted, ...set] }; };
const blank = () => ({ v: 3, updatedAt: now(), units: [], items: [], tests: [], papers: [], log: {}, exams: [], writing: [], materials: [], deleted: [] });
/* v2 → v3 移行。既存データを引き継ぐ */
function migrate(d) {
  if (!d) return blank();
  if (d.v === 3) return { ...blank(), ...d };
  const items = (d.items || []).map((i) => {
    const level = i.status === "mastered" ? STABLE_LEVEL : Math.min(i.streak || 0, 3);
    return { ...i, level, status: level >= STABLE_LEVEL ? "stable" : "active", etype: i.etype || "", updatedAt: now(),
      history: (i.history || []).map((h) => ({ d: h.d, r: h.r === "o" ? "o" : "x" })) };
  });
  const exams = d.exam && d.exam.date ? [{ id: uid(), name: d.exam.name || "", date: d.exam.date, unitIds: d.exam.unitIds || [], actual: {}, updatedAt: now() }] : [];
  return { ...blank(), units: (d.units || []).map((u) => ({ ...u, updatedAt: now() })), items, tests: (d.tests || []).map((t) => ({ ...t, updatedAt: now() })), exams };
}

/* ---- 同期（Supabase の1行） ---- */
async function sbFetch(path, opts = {}) {
  const base = LS(SB_URL).replace(/\/$/, "");
  const res = await fetch(`${base}/rest/v1/${path}`, { ...opts, headers: { apikey: LS(SB_KEY), Authorization: `Bearer ${LS(SB_KEY)}`, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(`同期エラー (${res.status})`);
  const text = await res.text(); // 書き込み成功時（201, return=minimal）は本文が空。空なら null
  return text ? JSON.parse(text) : null;
}
async function pullRemote() { const rows = await sbFetch(`state?id=eq.${encodeURIComponent(LS(SB_ROOM))}&select=data,updated_at`); return rows && rows[0] ? rows[0] : null; }
async function pushRemote(data) { await sbFetch("state", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ id: LS(SB_ROOM), data, updated_at: new Date().toISOString() }) }); }
function mergeData(a, b) {
  const del = new Set([...(a.deleted || []), ...(b.deleted || [])]);
  const byId = (xs, ys) => { const m = new Map(); [...(xs || []), ...(ys || [])].forEach((r) => { if (del.has(r.id)) return; const p = m.get(r.id); if (!p || (r.updatedAt || "") > (p.updatedAt || "")) m.set(r.id, r); }); return [...m.values()]; };
  return { v: 3, updatedAt: now(), units: byId(a.units, b.units), items: byId(a.items, b.items), tests: byId(a.tests, b.tests), papers: byId(a.papers, b.papers), exams: byId(a.exams, b.exams), writing: byId(a.writing, b.writing), materials: byId(a.materials, b.materials), log: { ...(a.log || {}), ...(b.log || {}) }, deleted: [...del] };
}

/* ---- 教材画像（Supabase Storage） ---- */
const MBUCKET = "materials";
const matPath = (subject, kind, page) => `${LS(SB_ROOM)}/${SUBJ_CODE[subject]}/${KIND_CODE[kind]}/${page}.jpg`;
const stBase = () => `${LS(SB_URL).replace(/\/$/, "")}/storage/v1`;
const stHeaders = () => ({ apikey: LS(SB_KEY), Authorization: `Bearer ${LS(SB_KEY)}` });
async function stUpload(path, blob) {
  const res = await fetch(`${stBase()}/object/${MBUCKET}/${path}`, { method: "POST", headers: { ...stHeaders(), "Content-Type": blob.type || "image/jpeg", "x-upsert": "true" }, body: blob });
  if (!res.ok) throw new Error(`教材の保存エラー (${res.status})`);
}
const _matCache = new Map();
 // path → base64。端末に残さない（メモリだけ）
async function stGet(path) {
  if (_matCache.has(path)) return _matCache.get(path);
  const res = await fetch(`${stBase()}/object/authenticated/${MBUCKET}/${path}`, { headers: stHeaders() });
  if (!res.ok) throw new Error(`教材の読み出しエラー (${res.status})`);
  const b64 = bufToB64(await res.arrayBuffer());
  if (_matCache.size >= 40) _matCache.delete(_matCache.keys().next().value);
  _matCache.set(path, b64);
  return b64;
}
async function stRemove(paths) {
  if (!paths.length) return;
  const res = await fetch(`${stBase()}/object/${MBUCKET}`, { method: "DELETE", headers: { ...stHeaders(), "Content-Type": "application/json" }, body: JSON.stringify({ prefixes: paths }) });
  if (!res.ok) throw new Error(`教材の削除エラー (${res.status})`);
  paths.forEach((p) => _matCache.delete(p));
}

/* ---- ページ範囲と単元 ---- */
/* [10,11,12,15] → "10–12, 15" */
function pagesToRanges(nums) {
  const xs = [...new Set(nums.filter((n) => Number.isInteger(n)))].sort((a, b) => a - b);
  const out = []; let s = null, p = null;
  xs.forEach((n) => { if (s === null) { s = p = n; } else if (n === p + 1) { p = n; } else { out.push(s === p ? `${s}` : `${s}–${p}`); s = p = n; } });

  return out.join(", ");
}
/* "p.12-25, 30" → [12,…,25,30]。区切りは - – — ~ 〜、p. は無視 */
function parsePages(s) {
  const out = new Set(); const t = String(s || "").replace(/[pP]\.?|ページ|頁/g, " ");

}
const unitById = (d, id) => d.units.find((u) => u.id === id);
const unitPages = (u, kind) => parsePages(kind === "ワーク" ? u.wbPages : kind === "教科書" ? u.pages : "");
const unitForPage = (units, kind, page) => units.find((u) => unitPages(u, kind).includes(page)) || null;
const unitPageLabel = (u) => [u.pages ? `教科書 ${u.pages}` : "", u.wbPages ? `ワーク ${u.wbPages}` : ""].filter(Boolean).join(" ／ ");
/* 目次から読んだ候補を単元に反映する。既存の単元名に一致すればページ範囲だけ足し、なければ新規に作る */
function applyTOC(units, subject, kind, cands) {
  const field = kind === "ワーク" ? "wbPages" : "pages";
  const out = units.slice();
  cands.forEach((c) => {
    const name = (c.name || "").trim(), match = (c.match || "").trim();
    if (!name) return;
    const idx = out.findIndex((u) => u.subject === subject && (u.name === match || u.name === name));
    if (idx >= 0) { const u = out[idx]; const cur = u[field] || ""; const nv = !cur ? c.pages || "" : c.pages && !cur.includes(c.pages) ? `${cur}, ${c.pages}` : cur; out[idx] = { ...u, [field]: nv, updatedAt: now() }; }
    else out.push({ id: uid(), subject, name, pages: field === "pages" ? c.pages || "" : "", wbPages: field === "wbPages" ? c.pages || "" : "", lastTestedOn: null, updatedAt: now() });
  });

}
const matsOf = (d, subject, kind) => (d.materials || []).filter((m) => m.subject === subject && m.kind === kind).sort((a, b) => a.page - b.page);
/* 単元群に対応する教材ページ（索引）。多すぎるときは教材ごとに均等に間引く */
function materialsForUnits(d, subject, units, max = 16) {
  const by = MKINDS.map((kind) => { const pages = new Set(units.flatMap((u) => unitPages(u, kind))); return matsOf(d, subject, kind).filter((m) => pages.has(m.page)); }).filter((xs) => xs.length);
  const cap = Math.max(1, Math.floor(max / (by.length || 1)));
  const thin = (xs) => (xs.length <= cap ? xs : Array.from({ length: cap }, (_, k) => xs[Math.floor((k * xs.length) / cap)]));
  return by.flatMap(thin);
}
const matsLabel = (ms) => MKINDS.map((k) => { const xs = ms.filter((m) => m.kind === k); return xs.length ? `${k} p.${pagesToRanges(xs.map((m) => m.page))}` : ""; }).filter(Boolean).join("、");
const taught = (u) => !!u.learnedOn;

  const us = d.units.filter((u) => u.subject === subject && taught(u));
  const withActive = new Set(d.items.filter((i) => i.subject === subject && i.status === "active").map((i) => i.unitId));
  const score = (u) => (withActive.has(u.id) ? 1000 : 0) + (u.lastTestedOn ? diffDays(u.lastTestedOn, today()) : 500);
  return us.sort((a, b) => score(b) - score(a)).slice(0, max);

/* ---- 間隔反復と学力の指標 ---- */
/* 落とした項目を1件作る。今日 × で登録し、明日に出る。f で上書きできる */
const newItem = (f) => ({ id: uid(), note: "", fmt: "", createdOn: today(), history: [{ d: today(), r: "x", etype: f.etype || "" }], level: 0, failCount: 1, nextDue: addDays(today(), 1), status: "active", updatedAt: now(), ...f });
function applyJudgment(item, r) {
  const t = today();
  let level = item.level || 0, failCount = item.failCount || 0;
  if (r === "x") { level = 0; failCount += 1; }
  else if (r === "oo" || item.fmt === "知識・用語") { level = Math.min(level + 1, INT.length - 1); }
  else { level = Math.min(level + 1, 3); }
  return { ...item, level, failCount, nextDue: addDays(t, INT[level]), status: level >= STABLE_LEVEL ? "stable" : "active", gen: r === "x" ? null : item.gen, updatedAt: now() };
}
function retention(items) {
  let c = 0, t = 0;
  items.forEach((i) => { const h = i.history || [];
    for (let k = 1; k < h.length; k++) { const gap = diffDays(h[k - 1].d, h[k].d); if (gap >= 30) { t++; if (h[k].r !== "x") c++; } } });

}
function streakDays(log) {
  let n = 0, d = today();
  if (!log[d]) d = addDays(d, -1);
  while (log[d]) { n++; d = addDays(d, -1); }
  return n;
}

/* ---- 紙で回す（印刷セット・採点セット・一括確定） ---- */
/* 明日までに期日が来る未印刷の項目（子どもが判定中のものは除く） */
function printSet(d) {
  const lim = addDays(today(), 1);
  return d.items.filter((i) => !i.printedOn && i.nextDue <= lim && i.pending?.d !== today()).sort((a, b) => b.failCount - a.failCount || (a.nextDue < b.nextDue ? -1 : 1));
}
/* 印刷済みで、まだ確定していない項目 */
function gradeSet(d) {
  return d.items.filter((i) => i.printedOn).sort((a, b) => (a.printedOn < b.printedOn ? -1 : a.printedOn > b.printedOn ? 1 : b.failCount - a.failCount));
}
/* decisions: {id: {r, self, etype, etypeSelf}} または {id: {skip:true}}。r のあるものだけ判定し、skip は印刷前に戻す */
function judgeAll(d, decisions) {
  const t = today(); let n = 0;
  const items = d.items.map((i) => {
    const dc = decisions[i.id]; if (!dc) return i;
    if (dc.skip) return { ...i, printedOn: null, updatedAt: now() };
    if (!dc.r) return i;
    n++;
    const next = applyJudgment(i, dc.r);
    next.history = [...(i.history || []), { d: t, r: dc.r, self: dc.self || "", etype: dc.r === "x" ? dc.etype || "" : "", etypeSelf: dc.etypeSelf || "" }];
    next.pending = null; next.printedOn = null;
    if (dc.r === "x" && dc.etype) next.etype = dc.etype;
    return next;
  });
  return { d: { ...d, items, log: n ? { ...d.log, [t]: true } : d.log }, n };
}

/* ---- ×のタップ登録 ---- */
/* 印の当たり判定。表示上の距離（px）が近い印の添字、無ければ -1 */
function tapHit(marks, x, y, w, h, r = 22) {
  let best = -1, bd = r;
  marks.forEach((m, k) => { const dx = (m.x - x) * w, dy = (m.y - y) * h; const dd = Math.sqrt(dx * dx + dy * dy); if (dd < bd) { bd = dd; best = k; } });

/* そのページに登録済みの項目（座標つき） */
const marksOn = (d, path) => (d.items || []).filter((i) => i.src && i.src.path === path && typeof i.src.x === "number");
/* タップ位置を未定着項目にする。名前は仮（AIが後で付ける）。誤答の種類は「知らなかった」 */
function tapsToItems(taps, subject, us, fallbackUnitId = "") {
  const perPage = {};
  return taps.map((t) => {
    const u = unitForPage(us, t.kind, t.page);
    const k = (perPage[t.path] = (perPage[t.path] || 0) + 1);
    return newItem({ subject, unitId: u ? u.id : fallbackUnitId || "", label: `${t.kind} p.${t.page} の×（${k}）`, named: false, etype: ETYPES[0], src: { path: t.path, kind: t.kind, page: t.page, x: t.x, y: t.y } });

}
const hasPos = (s) => !!(s && s.path && typeof s.x === "number" && typeof s.y === "number");
/* 類題生成の入力。元の問題（教材ページ）があれば画像を先に付ける */
const srcLabel = (s) => (s && s.path ? `${s.kind} p.${s.page}${s.q ? ` 「${s.q}」` : ""}` : "");
/* 印の位置にある問題の説明（AIへ渡す文） */
const markDesc = (s, n = null) => (hasPos(s) ? `${n ? `赤い${n}の印` : "赤い○印"}の位置にある問題（${s.kind} p.${s.page}）` : srcLabel(s));
/* 類題の生成結果を項目に反映する。名前が仮のままなら、AI が返した label / fmt も採用 */
function applyGen(item, g) {

  if (!item.named && item.src && hasPos(item.src) && g && g.label) { patch.label = g.label; patch.fmt = FORMATS.includes(g.fmt) ? g.fmt : item.fmt || ""; patch.named = true; }

}

/* ---- 索引と進度 ---- */
/* ページを「やった」にする（×を登録した、または×なしと押した）。最初の日を残す */
function markDone(d, paths, on = today()) {
  const set = new Set(paths);
  return { ...d, materials: (d.materials || []).map((mt) => (set.has(mt.path) && !mt.doneOn ? { ...mt, doneOn: on, updatedAt: now() } : mt)) };
}
/* やったページから進度を自動判定。単元のワーク（または教科書）のページのどれかが「やった」なら、その単元は習った扱い。手動の「ここまで」は残る */
function applyAutoProgress(d) {
  const done = new Map(); (d.materials || []).forEach((mt) => { if (mt.doneOn) done.set(`${mt.subject}/${mt.kind}/${mt.page}`, mt.doneOn); });
  if (!done.size) return d;
  let changed = false;
  const units = d.units.map((u) => {
    if (u.learnedOn) return u;
    const dates = MKINDS.flatMap((k) => unitPages(u, k).map((p) => done.get(`${u.subject}/${k}/${p}`)).filter(Boolean));
    if (!dates.length) return u;
    changed = true; return { ...u, learnedOn: dates.sort()[0], learnedBy: "auto", updatedAt: now() };

}
/* 定期テストの範囲で、ワークの手つかずのページ（取り込み済みなのに「やった」になっていないページ）。索引があれば問題数も */
function untouchedPages(d, unitIds) {
  const out = [];
  d.units.filter((u) => unitIds.includes(u.id)).forEach((u) => {
    const ms = matsOf(d, u.subject, "ワーク"); if (!ms.length) return;
    const pages = unitPages(u, "ワーク"); const left = ms.filter((mt) => pages.includes(mt.page) && !mt.doneOn);
    if (!left.length) return;
    const withIdx = left.filter((mt) => mt.idx && Array.isArray(mt.idx.ns));
    out.push({ unit: u, pages: left.map((mt) => mt.page), problems: withIdx.reduce((s, mt) => s + mt.idx.ns.length, 0), noIdx: left.length - withIdx.length });
  });
  return out;
}

/* ---- ホームの「いまやること」 ---- */
/* 前回の累積テストの日（作った用紙と記録した結果の新しい方）。無ければ null */
const lastCumOn = (d) => [...(d.papers || []).filter((p) => p.kind === "累積").map((p) => p.date), ...(d.tests || []).filter((x) => x.kind === "累積").map((x) => x.date)].sort().pop() || null;
function nextActions(d) {

  const pending = d.papers.filter((p) => p.status === "printed");

  const weekend = dow === 0 || dow === 6;
  const paperThisWeek = d.papers.some((p) => diffDays(p.date, t) <= 6);
  const nx = d.exams.filter((e) => e.date >= t).sort((a, b) => (a.date < b.date ? -1 : 1))[0];
  const left = nx ? diffDays(t, nx.date) : null;
  const stuck = d.items.filter((i) => i.status === "active" && i.failCount >= 3);
  const A = [];
  if (d.units.length === 0) A.push({ k: "units", title: "教科書の目次を撮って、単元を登録する", why: "最初に1回だけ。これがないと何も始まりません。", tab: "reg", mode: "unit", t: "5教科で10分" });
  else {
    const noProg = SUBJECTS.filter((sub) => d.units.some((u) => u.subject === sub) && !d.units.some((u) => u.subject === sub && u.learnedOn));
    if (noProg.length) A.push({ k: "prog", title: `進度を入れる（${noProg.join("・")}）`, why: "「ここまで習った」が未設定の教科があります。これがないと作問できません。", tab: "reg", mode: "unit", t: "1分" });
    if (pending.length) A.push({ k: "grade", title: `採点した答案を撮る（${pending.length}枚待ち）`, why: "赤ペンで採点したあと撮れば、結果と未定着項目が自動で入ります。", tab: "week", mode: "grade", t: "1枚2分" });
    if (!weekend && d.units.length > 0) A.push({ k: "wb", title: "今日のワークの×を登録", why: "ページを開いて×だった問題をタップするだけ。明日の「今日」に出ます。", tab: "reg", mode: "item", t: "2分" });
    const pendN = d.items.filter((i) => i.pending?.d === t).length;
    if (pendN) A.push({ k: "confirm", title: `子どもの判定 ${pendN} 件を確定する`, why: "机の紙と照らして、親の確定を押す。ここで初めて次回の日程が決まります。", tab: "today", mode: "cards", t: "5分" });
    const toGrade = d.items.filter((i) => i.printedOn && i.printedOn < t), toPrint = printSet(d);
    if (toGrade.length) A.push({ k: "mark", title: `昨日の分を採点する（${toGrade.length}件）`, why: "紙を見て、項目ごとに「できなかった／解けた／説明もできた」を押し、まとめて確定。", tab: "today", mode: "grade", t: "3分" });
    if (toPrint.length) A.push({ k: "print", title: `今日の分を印刷する（${toPrint.length}件）`, why: "類題を自動で作って1枚のPDFに。明日、机に置く。", tab: "today", mode: "print", t: "生成＋印刷で5分" });
    if (d.items.length === 0 && !pending.length) A.push({ k: "first", title: "最初の項目を入れる", why: "返却されたテストの答案を撮るのが最良の入口。なければ週末のテストから。", tab: "reg", mode: "item", t: "20分" });
    if (weekend && !paperThisWeek && !pending.length && d.items.length > 0) A.push({ k: "prog2", title: "「今週どこまで進んだ？」を聞いて進度を更新", why: "作問の前に。子どもに聞いて、該当の単元で「ここまで」を押すだけ。", tab: "reg", mode: "unit", t: "1分" });
    if (weekend && !paperThisWeek && !pending.length && d.items.length > 0) A.push({ k: "make", title: "今週のテストを作って印刷する", why: "5教科まとめて1タップ。単元は自動で選ばれます。", tab: "week", mode: "make", t: "生成3分＋印刷" });
    const cum = lastCumOn(d);
    if (d.items.length > 0 && d.units.some(taught) && (!cum || diffDays(cum, t) >= 30)) A.push({ k: "cum", title: cum ? `累積テストを作る（前回から ${diffDays(cum, t)} 日）` : "累積テストを作る", why: "過去の範囲を混ぜて初見で測る。学力の推移はこれで見る。月1回。", tab: "week", mode: "cum", t: "生成3分＋印刷" });
    if (left !== null && left <= 14 && left >= 0) A.push({ k: "exam", title: `定期テストまで ${left} 日。範囲の未定着だけやる`, why: "新しいことはやらない期間です。未出題の範囲があれば最優先。", tab: "exam", t: "" });
    if (stuck.length) A.push({ k: "stuck", title: `3回以上落ちている ${stuck.length} 件を診断する`, why: "反復では解決しません。前提に戻る手順を出します。", tab: "today", mode: "cards", t: "" });
  }
  return { A, due, left, nx };
}

/* ==================== 3. AI ==================== */

/* ---- 呼び出し ---- */
const MODEL = "claude-opus-5";
const FALLBACK = "claude-sonnet-4-6";
let lastUsed = "";
const usedLabel = () => (lastUsed === MODEL ? "Opus 5" : lastUsed === FALLBACK ? "Sonnet 4.6" : "");
const API_HEADERS = () => ({ "Content-Type": "application/json", "x-api-key": LS(AKEY), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" });
async function once(model, content, system, maxTokens) {
  if (!hasKey()) throw new Error("APIキーが未設定です。「設定」タブで登録してください。");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers: API_HEADERS(),
    body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: [{ role: "user", content }] }),
  });
  let data; try { data = await res.json(); } catch { throw new Error(`応答を読めませんでした (HTTP ${res.status})`); }
  if (!res.ok || data.error) throw new Error(data?.error?.message || `エラー (HTTP ${res.status})`);
  const text = (data.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");
  if (!text) throw new Error("空の応答");
  return text;
}
async function callAI(content, system, maxTokens = 2200, force = null) {
  const order = force ? [force] : lastUsed ? [lastUsed, ...[MODEL, FALLBACK].filter((m) => m !== lastUsed)] : [MODEL, FALLBACK];
  let err;
  for (const m of order) { try { const t = await once(m, content, system, maxTokens); lastUsed = m; return t; } catch (e) { err = e; } }
  throw err;
}
function parseJSON(text) {
  const t = text.replace(/```json|```/g, "").trim();
  const s = Math.min(...["{", "["].map((c) => t.indexOf(c)).filter((x) => x >= 0));
  const e = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  return JSON.parse(t.slice(s, e + 1));
}
const imgBlock = (b64) => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64 } });

/* ---- 類題・項目名・索引 ---- */
const ctxFor = (d, i) => ({ siblings: d.items.filter((x) => x.unitId === i.unitId && x.status === "active" && x.id !== i.id).map((x) => x.label), stable: d.items.filter((x) => x.subject === i.subject && x.status === "stable").map((x) => x.label), units: d.units.filter((x) => x.subject === i.subject).map((x) => x.name) });
const itemContext = (i, u, ctx) => `教科: ${i.subject}\n単元: ${u ? u.name : "不明"}\n未定着項目: ${i.label}\n${i.note ? "間違え方: " + i.note : ""}\n出題形式: ${i.fmt || "不明"} / 誤答の種類: ${i.etype || "不明"}\n落とした回数: ${i.failCount}\n履歴: ${(i.history || []).map((h) => `${h.d}:${h.r}`).join(" ") || "なし"}\n同単元の他の未定着: ${ctx.siblings.join(" / ") || "なし"}\n安定している項目: ${ctx.stable.slice(0, 12).join(" / ") || "なし"}\n習った範囲: ${ctx.units.join(" / ")}`;
function genContent(item, b64, text) {
  if (!b64 || !item.src) return text;
  return [{ type: "text", text: `【元の問題】${markDesc(item.src)} — 子どもが落とした問題。同じ考え方・同じ形式を問い、数値や設定は変える。問題文をそのまま写さない。${item.named === false ? "あわせて、この問題を解くのに必要な「身についていないと解けない一点」を label に（後日その一点だけを聞き直せる粒度）、形式を fmt に（" + FORMATS.join("／") + " から）入れる。" : ""}` }, imgBlock(b64), { type: "text", text }];
}
/* 1項目ぶんの類題（3問＋説明の問い）。用語は記述形式。元の問題の画像があれば渡す */
async function genForItem(i, u, ctx, prev = "なし", model = null) {

    ? await callAI(genContent(i, b64, `${context}\n直前の問題（重複させない）: ${prev}\n\nこの読解技能だけを問う練習問題を。150〜250字のオリジナルの短い文章を1つ書き、その文章についてこの技能を問う設問を2問。`),

/* 座標つきで登録された項目に、AI が名前と形式を付ける。ページごとに1回。失敗したページは仮の名前のまま。戻り値は {id: {label, fmt, note, named}} */
async function nameItems(items, unitOf, model = null) {
  const out = {};
  const byPath = {}; items.filter((i) => hasPos(i.src) && !i.named).forEach((i) => { (byPath[i.src.path] = byPath[i.src.path] || []).push(i); });
  for (const path of Object.keys(byPath)) {

      const b64 = await annotateB64(await stGet(path), group.map((i) => ({ x: i.src.x, y: i.src.y })));
      const t = await callAI([imgBlock(b64), { type: "text", text: `添付は中学1年${s0.subject}の${s0.src.kind} p.${s0.src.page}。${u ? `単元は「${u.name}」。` : ""}赤い印（${group.length > 1 ? `①〜${group.length}の番号つき` : "1つ"}）の位置にある問題を子どもが間違えました。印ごとに、その問題を解くのに必要な「身についていないと解けない一点」を項目として書いてください。` }],
        `labelは後日その一点だけを聞き直せる粒度（「一次方程式」ではなく「係数が分数の一次方程式」）。summaryは問題の要約（30字以内。問題文をそのまま写さない）。fmtは ${FORMATS.join("／")} から。印の番号順に。JSONのみ: {"items":[{"n":1,"label":"","summary":"","fmt":""}]}`, 1200, model);
      const rs = parseJSON(t).items || [];
      group.forEach((i, k) => { const r = rs.find((x) => Number(x.n) === k + 1) || rs[k]; if (r && r.label) out[i.id] = { label: r.label, fmt: FORMATS.includes(r.fmt) ? r.fmt : "", note: r.summary || "", named: true }; });
    } catch (e) { /* 仮の名前のまま。類題生成のときにもう一度試す */ }

}
/* ページの問題番号の索引を AI で作る。{ns:["1","2(1)",…], at} */
const _idxTried = new Set();
 // このセッションで索引を作りにいったページ（成功・失敗とも）

/* 用紙の資料ページに載せる図。refs は教材ページへの参照（res に読み込み済みの base64 があれば描画、無ければ枠だけ）。imgs は旧データの写真 */
function paperFigs(p, res = {}) {
  const refs = (p.refs || []).map((r) => ({ cap: `図${r.n}（${r.kind} p.${r.page}）`, b64: res[r.path] || null, pending: !res[r.path] }));
  const imgs = (p.imgs || []).map((b, i) => ({ cap: `図${refs.length + i + 1}`, b64: b, pending: false }));

}
/* 問題文が参照している図番号（「図3」「図 3」）と fig 欄 */
function usedFigs(questions) {
  const s = new Set();
  (questions || []).forEach((q) => { for (const m of String(q.q || "").matchAll(/図\s*(\d+)/g)) s.add(+m[1]); if (q.fig > 0) s.add(+q.fig); });

}
/* 用紙の refs を共有先から読む。読めないページは枠だけになる */
async function resolveRefs(p, onStep) {
  const res = {}; const refs = p.refs || [];
  for (let k = 0; k < refs.length; k++) { onStep && onStep(`資料 ${k + 1}/${refs.length}`); try { res[refs[k].path] = await stGet(refs[k].path); } catch {} }
  return res;
}
function paperHTML(p, res = {}) {

  const qs = p.questions.map((q) => { const svg = safeSvg(q.svg); return `<div class="p"><div class="pn">${q.n}.</div><div class="pt"><p class="pq">${escHTML(q.q)}</p>${svg ? `<div class="fig">${svg}</div>` : ""}${Array.from({ length: svg ? Math.max(2, nl - 1) : nl }, () => `<div class="rule"></div>`).join("")}</div></div>`; }).join("");

function fileHTML(p, res = {}) {

}
function paperText(p) {
  const nl = LINES[p.subject] || 2, gap = "\n" + "　\n".repeat(nl);
  const figs = (p.refs || []).map((r) => `図${r.n}: ${r.kind} p.${r.page}`).join("、");
  return `${p.subject}　${p.kind}テスト（${p.code}）${figs ? "\n資料: " + figs + "（本を開いて見る）" : ""}${p.passage ? "\n\n" + (p.title || "") + "\n" + p.passage : ""}\n\n日付　　／　　　名前　　　　　　　　　点　　／${p.questions.length}\n\n${p.questions.map((q) => `${q.n}. ${q.q}${q.svg ? "（図あり・印刷版参照）" : ""}${gap}`).join("\n")}\n\n————　解答　————\n\n${p.questions.map((q) => `${q.n}. ${q.a}`).join("\n")}`;
}
function genToPaper(items, unitOf) {
  const qs = []; let n = 0;
  items.forEach((i) => { const g = i.gen; if (!g || !g.problems || !g.problems.length) return; const u = unitOf(i.unitId); const isTerm = i.fmt === "知識・用語";
    const head = `【${i.subject}・${u ? u.name : ""}】${g.passage ? "\n" + g.passage + "\n" : ""}`;
    const why = !isTerm && g.why ? g.why : "";
    g.problems.forEach((p, k) => { n++; const last = k === g.problems.length - 1 && !why; qs.push({ n, q: `${k === 0 ? head : ""}${p.q}${last ? "\n" + SELF_LINE : ""}`, a: p.a, label: i.label, aim: "", fmt: i.fmt, svg: "" }); });
    if (why) { n++; qs.push({ n, q: `説明：${why}\n${SELF_LINE}`, a: "（手順の理由が自分の言葉で言えていれば「説明もできた」）", label: i.label, aim: "説明させる問い", fmt: i.fmt, svg: "" }); } });
  const subj = items.length === 1 ? items[0].subject : "回収";
  return { subject: subj, code: today().slice(5).replace("-", "") + "回", kind: "類題", questions: qs, imgs: [] };
}

/* ---- PDF ---- */
/* 用紙（1枚または複数）を1つのPDFに。各用紙の「資料＋問題」を先に並べ、用紙ごとにページ数が奇数なら白紙を足して偶数にする。
   解答は全用紙ぶんを最後に、教科で改ページせず1つの流れで詰める。両面印刷1回で、解答が必ず別の紙になる */
async function buildPDF(papers, onStep) {
  const list = Array.isArray(papers) ? papers : [papers];
  const res = {}; for (const p of list) Object.assign(res, await resolveRefs(p, onStep)); // 教材ページは用紙に持たず、ここで読む
  await loadLibs();
  const { jsPDF } = window.jspdf;
  const W = 794, H = 1123, PX = 60, PT = 64, PB = 60;
  const fr = document.createElement("iframe");
  fr.setAttribute("aria-hidden", "true");
  fr.style.cssText = `position:fixed;left:-10000px;top:0;width:${W}px;height:1200px;border:0;opacity:0;pointer-events:none`;
  document.body.appendChild(fr);
  const doc = fr.contentDocument;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#fff;color:#111}.sw,.sw *{color:#111;border-color:#111}${SHEET_CSS}.sw{width:${W}px;background:#fff;font-size:14.5px}.sw .sheet{padding:0 ${PX}px;background:#fff}.sw .cols{column-count:1}.sw .pq{font-size:15px}.sw .arow,.sw .at{font-size:13.5px}.sw .aim{font-size:12px}.sw .psg{font-size:14px}.sw .rule{border-bottom-color:#B0B0B0}.sw .note,.sw .aim{color:#444}</style></head><body><div class="sw">${list.map((p) => `<div class="pp">${paperHTML(p, res)}</div>`).join("")}</div></body></html>`);
  doc.close();
  await new Promise((r) => setTimeout(r, 150));
  const host = doc.body;
  try {
    const pdf = new jsPDF({ unit: "px", format: [W, H], hotfixes: ["px_scaling"] });
    let firstPage = true, n = 0;
    const pages = () => (firstPage ? 0 : pdf.internal.getNumberOfPages());
    const blocksOf = (sh) => [...sh.children].flatMap((el) => (el.classList.contains("cols") || el.classList.contains("aim") ? [...el.children] : [el]));
    const draw = async (blocks) => {
      if (!firstPage) pdf.addPage(); firstPage = false;
      let y = PT;
      for (const el of blocks) {
        n++; onStep && onStep(n);
        const mb = parseFloat(getComputedStyle(el).marginBottom) || 0;
        const cv = await window.html2canvas(el, { scale: 2, backgroundColor: "#fff", logging: false, windowWidth: W });
        const w = W - PX * 2, h = (cv.height / cv.width) * w;
        const usable = H - PT - PB;
        if (h > usable) {
          let off = 0; const pageCanvasH = Math.floor(usable * (cv.width / w));
          while (off < cv.height) {
            if (y + Math.min(usable, ((cv.height - off) / cv.width) * w) > H - PB && y > PT) { pdf.addPage(); y = PT; }
            const part = document.createElement("canvas"); const ph = Math.min(pageCanvasH, cv.height - off);
            part.width = cv.width; part.height = ph; part.getContext("2d").drawImage(cv, 0, off, cv.width, ph, 0, 0, cv.width, ph);
            const dh = (ph / cv.width) * w; pdf.addImage(part.toDataURL("image/jpeg", 0.9), "JPEG", PX, y, w, dh); y += dh; off += ph;
            if (off < cv.height) { pdf.addPage(); y = PT; }
          }
          y += mb; continue;
        }
        if (y + h > H - PB && y > PT) { pdf.addPage(); y = PT; }
        pdf.addImage(cv.toDataURL("image/jpeg", 0.9), "JPEG", PX, y, w, h);
        y += h + mb;
      }
    };
    // 問題（資料を含む）を用紙ごとに。奇数ページなら白紙を1枚足す
    for (const pp of host.querySelectorAll(".pp")) {
      const before = pages();
      for (const sh of pp.querySelectorAll('.sheet[data-part="q"]')) await draw(blocksOf(sh));
      if (needBlank(pages() - before)) pdf.addPage();
    }
    // 解答は最後に。教科ごとに改ページせず、1つの流れで詰める
    const ans = [...host.querySelectorAll('.sheet[data-part="a"]')].flatMap(blocksOf);
    if (ans.length) await draw(ans);
    return pdf;
  } finally { fr.remove(); }
}
/* 問題のページ数が奇数なら白紙を1枚足す（両面印刷で解答を別の紙にするため） */
const needBlank = (pages) => pages % 2 === 1;
const pdfName = (list) => (list.length === 1 ? `${list[0].subject}_${list[0].code}.pdf` : `確認テスト_${today()}_${list.length}教科.pdf`);
async function exportPDF(papers, onStep) {
  const list = Array.isArray(papers) ? papers : [papers];
  const pdf = await buildPDF(list, onStep); const name = pdfName(list);
  if (await shareFile(pdf.output("blob"), name, "application/pdf")) return;
  pdf.save(name);
}

  </>);
}

      <Fld label="どのテストか"><select value={pid} onChange={(e) => { setPid(e.target.value); setMarks(null); }}>{pending.map((p) => (<option key={p.id} value={p.id}>{p.date.slice(5)} {p.subject} {p.kind} {p.code}</option>))}</select></Fld>

      if (st.length) L.push(`  安定: ${st.length}件`);
      const stuck = act.filter((i) => i.failCount >= 3); if (stuck.length) L.push("  ※理解の欠落が疑われる: " + stuck.map((i) => i.label).join("、")); });
    const rd = d.items.filter((i) => i.fmt === "長文読解" && i.status === "active"); if (rd.length) L.push("", "■ 読解で落としている技能: " + rd.map((i) => i.label).join("、"));

    L.push("", "■ 依頼", ask); return L.join("\n"); }, [d, ask]);

  return (<div className="pane"><p className="lead">週1回程度、これを貼って相談してください。読解教材の作成、記述の添削、3回以上落ちた項目の対応は、こちらで扱います。</p>

}
function Settings({ d, save, setSync }) {
  const [key, setKey] = useState(LS(AKEY)); const [url, setUrl] = useState(LS(SB_URL)); const [anon, setAnon] = useState(LS(SB_KEY)); const [room, setRoom] = useState(LS(SB_ROOM));
  const [msg, setMsg] = useState(""); const [busy, setBusy] = useState("");
  const say = (t) => { setMsg(t); setTimeout(() => setMsg(""), 4000); };
  const saveKey = () => { localStorage.setItem(AKEY, key.trim()); say(key.trim() ? "APIキーを保存しました" : "削除しました"); };
  const testKey = async () => { setBusy("key"); localStorage.setItem(AKEY, key.trim()); try { await callAI("1+1は？数字だけ。", "簡潔に。", 30); say(`接続できました（${usedLabel()}）`); } catch (e) { say("失敗: " + e.message); } setBusy(""); };
  const saveSync = () => { localStorage.setItem(SB_URL, url.trim()); localStorage.setItem(SB_KEY, anon.trim()); localStorage.setItem(SB_ROOM, room.trim()); say("同期設定を保存しました"); };
  const genRoom = () => setRoom("fam-" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10));
  const testSync = async () => { setBusy("sync"); saveSync(); try { const remote = await pullRemote(); const merged = remote ? mergeData(d, migrate(remote.data)) : d; await pushRemote(merged); save(merged); setSync("ok"); say("同期できました。サーバーの内容と統合しました。"); } catch (e) { setSync("err"); say("失敗: " + e.message); } setBusy(""); };
  const backup = () => { const blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `gakushu_${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); };
  const restore = (e) => { const f = e.target.files?.[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const p = JSON.parse(r.result); if (!p.items || !p.units) throw new Error(); save(mergeData(d, migrate(p))); say("統合しました"); } catch { say("読み込めませんでした"); } }; r.readAsText(f); };
  const [paste, setPaste] = useState("");
  const copyLink = async () => { saveSync(); localStorage.setItem(AKEY, key.trim()); const link = cfgLink(window.location.href); say((await copyToClipboard(link)) ? "リンクをコピーしました。LINE やメールで自分に送ってください" : "コピーできませんでした"); };
  const doImport = () => { const n = importCfg(paste); if (!n) { say("読み取れませんでした。リンク全体を貼ってください"); return; } setUrl(LS(SB_URL)); setAnon(LS(SB_KEY)); setRoom(LS(SB_ROOM)); setKey(LS(AKEY)); setPaste(""); say(`${n}件を取り込みました。「接続して同期」を押してください`); };
  return (<div className="pane">
    <section className="sec"><h3 className="s-h">設定を別の端末に渡す</h3>
      <p className="lead">設定済みの端末で「リンクをコピー」すると、プロジェクトURL・anon キー・共有ID・APIキーの入っているもの全部が1本のリンクになります。LINE やメールで自分に送る。もう一方の端末でそのリンクを開くか、下の欄に貼って「取り込む」。ホーム画面のアプリは Safari と保存場所が別なので、アプリ側では貼り付けを使ってください。</p>
      <button className="btn-sm" onClick={copyLink} disabled={!url && !anon && !room && !key}>リンクをコピー</button>
      <Fld label="受け取ったリンクを貼る"><input value={paste} onChange={(e) => setPaste(e.target.value)} placeholder="https://…#cfg=…" autoComplete="off" /></Fld>
      <button className="btn-sm" onClick={doImport} disabled={!paste.trim()}>取り込む</button>
      <p className="q-warn">リンクには共有IDとキーが入っています。パスワードと同じ扱いで、送ったメッセージは消してください。</p></section>
    <section className="sec"><h3 className="s-h">夫婦でデータを共有する</h3>
      <p className="lead">Supabaseの無料枠を使います。supabase.com でプロジェクトを作り、SQL Editor で下を実行してください。所要15分、費用ゼロ。</p>
      <pre className="sql">{`create table state (\n  id text primary key,\n  data jsonb,\n  updated_at timestamptz default now()\n);\nalter table state enable row level security;\ncreate policy rw on state for all\n  to anon using (true) with check (true);\n\n-- 教材画像（ワーク・教科書）用の非公開バケット\ninsert into storage.buckets (id, name, public)\n  values ('materials', 'materials', false);\ncreate policy mat on storage.objects for all\n  to anon using (bucket_id = 'materials')\n  with check (bucket_id = 'materials');`}</pre>
      <Fld label="プロジェクトURL（Settings → API）"><input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://xxxx.supabase.co" /></Fld>
      <Fld label="anon キー"><input type="password" value={anon} onChange={(e) => setAnon(e.target.value)} placeholder="eyJ..." /></Fld>
      <Fld label="共有ID（知っている人だけがデータに触れます）"><input value={room} onChange={(e) => setRoom(e.target.value)} placeholder="fam-..." /></Fld>
      <div className="q-btns"><button className="btn-sm" onClick={genRoom}>共有IDを作る</button><button className="btn-sm" onClick={saveSync}>保存</button><button className="btn-sm" onClick={testSync} disabled={busy === "sync" || !url || !anon || !room}>{busy === "sync" ? "確認中…" : "接続して同期"}</button></div>
      <p className="q-warn">奥様の端末では同じ3つを入れて「接続して同期」。以後は自動です。項目単位で新しい方を採用するので、2人が別々に入力しても消えません。共有IDはパスワードと同じ扱いです。</p></section>
    <section className="sec"><h3 className="s-h">APIキー</h3><p className="lead">AI機能に必要です。console.anthropic.com で発行。この端末の中にだけ保存されます。</p>
      <Fld label="Anthropic API キー"><input type="password" value={key} onChange={(e) => setKey(e.target.value)} placeholder="sk-ant-..." autoComplete="off" /></Fld>
      <div className="q-btns"><button className="btn-sm" onClick={saveKey}>保存</button><button className="btn-sm" onClick={testKey} disabled={busy === "key" || !key.trim()}>{busy === "key" ? "確認中…" : "接続を確認"}</button></div></section>
    <section className="sec"><h3 className="s-h">バックアップ</h3><p className="lead">月1回は書き出してください。読み込みは上書きではなく統合です。</p>
      <div className="q-btns"><button className="btn-sm" onClick={backup}>書き出す</button><label className="btn-sm ctr">読み込む<input type="file" accept="application/json" onChange={restore} hidden /></label></div>
      <p className="q-warn">未定着 {d.items.filter((i) => i.status === "active").length} ／ 安定 {d.items.filter((i) => i.status === "stable").length} ／ 記録 {d.tests.length} ／ 単元 {d.units.length}</p></section>
    <section className="sec"><h3 className="s-h">ホーム画面に追加</h3><p className="lead">Safariで開き、共有ボタン →「ホーム画面に追加」。印刷もSafariの共有から行えます。</p></section>
    <section className="sec"><h3 className="s-h">バージョン</h3><p className="lead">v{VERSION}（コミットの日時）。画面が古いと感じたら、アプリを完全に終了して開き直し、この日時が進んでいるか確認してください。</p></section>
    {msg && <p className="msg fixed">{msg}</p>}
  </div>);
}
